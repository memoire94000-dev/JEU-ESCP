  --bleu: #1F6FD1;
  --bleu-fonce: #154F98;
  --papier: #F7FAFC;
  --bureau: #E3ECF4;
  --ligne: #D3E1EC;
  --texte: #15253B;
  --gris: #5A6B80;
  --vert: #1E8E5A;
  --rouge: #C8372D;
  --ambre: #FFD24A;
  --f-titre: 'Archivo', 'Arial Narrow', system-ui, sans-serif;
  --f-texte: 'Lexend', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --rayon: 14px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column;
  font-family: var(--f-texte); font-size: 16px; line-height: 1.55; color: var(--texte); font-weight: 350;
  background: var(--bureau);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--ciel); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--f-titre); font-variation-settings: 'wdth' 112; line-height: 1.15; margin: 0 0 .4em; }
.papier {
  background-color: var(--papier);
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, rgba(160, 190, 214, .22) 31px 32px);
  border-radius: var(--rayon);
  box-shadow: 0 1px 0 #fff inset, 0 2px 0 rgba(18, 48, 90, .08), 0 10px 26px -14px rgba(18, 48, 90, .35);
}

/* ---------- Entête et pied ---------- */
.entete {
  display: flex; align-items: center; gap: 12px; padding: 8px 14px;
  background: var(--encre); color: #fff; position: sticky; top: 0; z-index: 20;
}
.vers-accueil { background: none; border: 0; padding: 4px; border-radius: 10px; }
.marque { display: inline-flex; align-items: center; gap: 8px; }
.cerveau { width: 38px; height: 31px; }
.mot-marque { font-family: var(--f-titre); font-weight: 800; font-size: 1.35rem; letter-spacing: -.01em; color: #fff; }
.mot-marque span { color: var(--ciel); }
.contexte { flex: 1; font-size: .92rem; opacity: .85; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icone-btn { background: rgba(255, 255, 255, .1); border: 0; border-radius: 10px; width: 40px; height: 40px; font-size: 1.1rem; }
#app { flex: 1; width: 100%; max-width: 1080px; margin: 0 auto; padding: 18px 16px 30px; }
body.mode-hote #app { max-width: none; padding: 0; }
body.en-jeu .pied { display: none; }
.pied { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; padding: 14px; font-size: .88rem; color: var(--gris); }
.pied a, .lien { color: var(--bleu-fonce); background: none; border: 0; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }

/* ---------- Boutons ---------- */
.btn {
  font-family: var(--f-titre); font-weight: 700; font-size: 1rem; letter-spacing: .01em;
  border-radius: 12px; padding: 13px 20px; border: 2px solid transparent;
  transition: transform .06s, box-shadow .06s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
}
.btn:active:not(:disabled) { transform: translateY(3px); }
.btn.principal { background: var(--bleu); color: #fff; box-shadow: 0 4px 0 var(--bleu-fonce); }
.btn.principal:active:not(:disabled) { box-shadow: 0 1px 0 var(--bleu-fonce); }
.btn.secondaire { background: #fff; color: var(--encre); border-color: var(--encre); box-shadow: 0 4px 0 var(--encre); }
.btn.secondaire:active:not(:disabled) { box-shadow: 0 1px 0 var(--encre); }
.btn.discret { background: transparent; color: var(--encre); border-color: #B9CBDB; }
.btn.grand { width: 100%; font-size: 1.12rem; padding: 16px 20px; }
.btn.petit { padding: 7px 12px; font-size: .88rem; border-radius: 9px; }
.ligne-btn { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 14px; }
.retour { background: none; border: 0; color: var(--bleu-fonce); font-weight: 700; padding: 4px 0; margin-bottom: 10px; }

/* ---------- Textes ---------- */
.titre-jeu { font-size: clamp(2.6rem, 11vw, 4.6rem); font-weight: 900; font-variation-settings: 'wdth' 125; color: var(--encre); letter-spacing: -.02em; margin: 6px 0 4px; }
.titre-page { font-size: clamp(1.7rem, 5vw, 2.4rem); font-weight: 800; color: var(--encre); }
.chapeau { font-size: 1.12rem; max-width: 34em; margin: 0 0 18px; }
.sous-titre { font-size: 1.15rem; font-weight: 800; color: var(--encre); margin: 22px 0 12px; display: flex; align-items: center; gap: 10px; }
.petit-titre { font-size: .9rem; color: var(--gris); margin: 0 0 4px; }
.aide-txt { font-size: .92rem; color: var(--gris); margin: 8px 0; }
.aide-txt.fort { color: var(--encre); font-weight: 700; }
.alerte { background: #FFF3CC; border-left: 5px solid var(--ambre); padding: 10px 14px; border-radius: 8px; font-size: .95rem; color: #5A4300; }
.ok-txt { background: #E2F4EA; border-left: 5px solid var(--vert); padding: 10px 14px; border-radius: 8px; }
.vide { color: var(--gris); font-style: italic; }
.attente-centre { text-align: center; padding: 60px 10px; display: grid; gap: 16px; justify-items: center; }

/* ---------- Pastilles ---------- */
.pastille {
  display: inline-grid; place-items: center; flex: none; width: 2em; height: 2em; border-radius: 50%;
  color: #fff; font-family: var(--f-titre); font-weight: 800; font-size: .82em; letter-spacing: .02em;
}

/* ---------- Accueil ---------- */
.deux-col { display: grid; gap: 18px; }
@media (min-width: 820px) { .deux-col { grid-template-columns: 1.3fr 1fr; align-items: start; gap: 34px; } }
.dossiers { display: grid; gap: 40px; padding-top: 14px; }
.dossier {
  position: relative; display: grid; gap: 2px; text-align: left; border: 0; padding: 16px 18px 16px 20px;
  background: var(--papier); border-radius: 4px 14px 14px 14px; border-left: 7px solid var(--c);
  box-shadow: 0 2px 0 rgba(18, 48, 90, .08), 0 10px 24px -16px rgba(18, 48, 90, .5);
  transition: transform .12s;
}
.dossier:hover { transform: translateY(-2px); }
.dossier .onglet {
  position: absolute; left: -7px; top: -26px; height: 27px; padding: 4px 14px 0; border-radius: 9px 9px 0 0;
  background: var(--c); color: #fff; font-size: .82rem; white-space: nowrap;
}
.dossier .onglet b, .dossier-ouvert .onglet b, .live-titre .onglet b { font-family: var(--f-titre); }
.dossier .nom-jeu { font-family: var(--f-titre); font-size: 1.5rem; font-weight: 800; font-variation-settings: 'wdth' 118; color: var(--encre); }
.dossier .accroche { color: var(--gris); font-size: .97rem; }
.d-qcm { --c: var(--bleu); }
.d-escape { --c: var(--encre); }
.d-reflexe { --c: var(--vert); }
.d-escape .onglet { color: var(--ambre); }
.dossier[aria-pressed="true"] { outline: 3px solid var(--c); outline-offset: 2px; background: #fff; }
.dossier[aria-pressed="false"] { opacity: .72; }
.bloc-groupe { padding: 18px 18px 22px; display: grid; gap: 12px; align-content: start; }
.bloc-groupe .sous-titre { margin-top: 0; }
.bloc-groupe p { margin: 0 0 4px; }

/* ---------- Choix du niveau ---------- */
.dossier-ouvert { position: relative; margin-top: 30px; background: var(--papier); border-left: 7px solid var(--c); border-radius: 4px 14px 14px 14px; padding: 16px 20px; box-shadow: 0 10px 24px -16px rgba(18, 48, 90, .5); }
.dossier-ouvert .onglet { position: absolute; left: -7px; top: -26px; height: 27px; padding: 4px 14px 0; border-radius: 9px 9px 0 0; background: var(--c); color: #fff; font-size: .82rem; }
.dossier-ouvert .nom-jeu { font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 900; font-variation-settings: 'wdth' 122; color: var(--encre); }
.regles { margin: 6px 0 0; padding-left: 1.2em; }
.regles li { margin: 4px 0; }
.champ { display: grid; gap: 6px; font-weight: 700; margin: 18px 0 4px; }
.champ input, .champ textarea {
  font: inherit; font-weight: 400; padding: 12px 14px; border: 2px solid #B9CBDB; border-radius: 10px; background: #fff; width: 100%;
}
.champ textarea { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; }
.choix-niveaux { display: grid; gap: 12px; }
@media (min-width: 700px) { .choix-niveaux { grid-template-columns: repeat(2, 1fr); } }
.carte-niveau {
  display: grid; gap: 4px; text-align: left; padding: 16px 18px; border-radius: 14px; border: 2px solid var(--nc);
  background: #fff; box-shadow: 0 4px 0 var(--nc); transition: transform .06s;
}
.carte-niveau:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--nc); }
.carte-niveau b { font-family: var(--f-titre); font-size: 1.35rem; font-weight: 800; color: var(--nc); }
.carte-niveau span { color: var(--gris); font-size: .95rem; }
.carte-niveau .record { color: var(--encre); font-weight: 700; font-size: .88rem; }
.n1 { --nc: #1E8E5A; } .n2 { --nc: #1F6FD1; } .n3 { --nc: #B5591B; } .n4 { --nc: #12305A; }

/* ---------- Écran de jeu ---------- */
.ecran-jeu { max-width: 760px; margin: 0 auto; }
.jeu-tete { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.titre-partie { color: var(--gris); font-size: .95rem; }
.titre-partie b { color: var(--encre); font-family: var(--f-titre); }
.zone-jeu { position: relative; }
.jeu-barre { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin-bottom: 8px; }
.compteur { display: grid; line-height: 1.05; }
.compteur b { font-family: var(--f-titre); font-weight: 900; font-size: 2.3rem; font-variation-settings: 'wdth' 115; color: var(--encre); font-variant-numeric: tabular-nums; }
.compteur span { font-size: .85rem; color: var(--gris); }
.compteur.droite { text-align: right; }
.compteur b.urgent { color: var(--rouge); }
.chrono, .avance { height: 9px; border-radius: 9px; background: var(--ligne); overflow: hidden; margin-bottom: 14px; }
.chrono i, .avance i { display: block; height: 100%; background: var(--bleu); transform-origin: left; transform: scaleX(1); }
.avance i { background: var(--vert); transform: scaleX(0); transition: transform .3s; }
.chrono i.urgent { background: var(--rouge); }
.consigne { font-size: .95rem; color: var(--gris); margin: 6px 0 12px; }

/* tampons d'encre */
.tampon {
  position: absolute; top: 14px; right: 12px; z-index: 5; pointer-events: none;
  font-family: var(--f-titre); font-weight: 900; font-variation-settings: 'wdth' 125; font-size: 1.9rem; letter-spacing: .03em;
  padding: 2px 14px; border: 4px solid currentColor; border-radius: 10px; background: rgba(255, 255, 255, .55);
  transform: rotate(-9deg); opacity: .92; animation: tamponner .32s cubic-bezier(.2, 1.5, .4, 1) both;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .6);
}
.tampon.vert { color: var(--vert); }
.tampon.rouge { color: var(--rouge); }
.tampon.fixe { top: auto; bottom: 14px; right: 14px; font-size: 1.5rem; }
.feuille-q > .tampon, .feuille > .tampon { top: -14px; right: 10px; font-size: 1.6rem; }
@keyframes tamponner { from { transform: rotate(-9deg) scale(2.3); opacity: 0; } to { transform: rotate(-9deg) scale(1); opacity: .92; } }

/* ---------- Sans faute ---------- */
.feuille-q { position: relative; padding: 18px 18px 20px; }
.feuille-q.entree { animation: glisser .28s ease-out; }
@keyframes glisser { from { transform: translateX(26px); opacity: 0; } to { transform: none; opacity: 1; } }
.source { font-size: .82rem; color: var(--gris); margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
.ue { background: var(--encre); color: #fff; border-radius: 6px; padding: 1px 7px; font-family: var(--f-titre); font-weight: 700; }
.question { font-size: clamp(1.25rem, 4.4vw, 1.6rem); font-weight: 700; font-variation-settings: 'wdth' 100; color: var(--encre); margin: 0 0 16px; min-height: 2.5em; }
.reponses, .choix { display: grid; gap: 10px; }
@media (min-width: 700px) { .reponses { grid-template-columns: 1fr 1fr; } }
.touche {
  display: flex; align-items: center; gap: 12px; text-align: left; padding: 13px 14px; min-height: 58px;
  background: #fff; border: 2px solid #C3D4E3; border-radius: 12px; box-shadow: 0 4px 0 #C3D4E3; font-size: 1.02rem;
  transition: transform .06s, background .15s;
}
.touche:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #C3D4E3; }
.touche .lettre { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: var(--encre); color: #fff; font-family: var(--f-titre); font-weight: 800; }
.touche.juste { background: var(--vert); border-color: var(--vert); color: #fff; box-shadow: 0 4px 0 #136843; }
.touche.faux { background: var(--rouge); border-color: var(--rouge); color: #fff; box-shadow: 0 4px 0 #8E241D; }
.touche.barre { text-decoration: line-through; opacity: .45; }
.touche:disabled:not(.juste):not(.faux) { opacity: .7; }
.explication { margin-top: 16px; background: #fff; border-left: 5px solid var(--ambre); border-radius: 8px; padding: 12px 14px; }
.explication p { margin: 0 0 8px; }

/* ---------- Escape game ---------- */
.escape { position: relative; }
.piece { width: 100%; max-width: 560px; display: block; margin: 0 auto; border-radius: var(--rayon); box-shadow: 0 10px 26px -14px rgba(18, 48, 90, .5); }
.piece .objet { cursor: pointer; transition: filter .15s; }
.piece .objet:hover, .piece .objet:focus { filter: brightness(1.12) drop-shadow(0 0 6px rgba(79, 184, 240, .9)); outline: none; }
.piece .etiquette { font-family: var(--f-titre); font-weight: 800; font-size: 13px; fill: var(--encre); text-anchor: middle; }
.piece .ecran-txt { font-family: var(--f-titre); font-weight: 800; font-size: 14px; fill: #fff; text-anchor: middle; }
.piece .tuile-txt { font-family: var(--f-titre); font-weight: 800; font-size: 9px; fill: var(--encre); text-anchor: middle; }
.piece .badge circle { fill: var(--vert); stroke: #fff; stroke-width: 3; }
.piece .badge text { fill: #fff; font-family: var(--f-titre); font-weight: 900; font-size: 17px; text-anchor: middle; }
.piece .badge.attente circle { fill: #fff; stroke: var(--encre); stroke-width: 2; stroke-dasharray: 4 3; }
.piece .badge.attente text { fill: var(--encre); font-size: 14px; }
.inventaire { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
@media (min-width: 640px) { .inventaire { grid-template-columns: repeat(4, 1fr); } }
.objet-puce { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; padding: 9px 11px; background: #fff; border: 2px solid #C3D4E3; border-radius: 12px; text-align: left; font-size: .9rem; }
.objet-puce .chiffre { font-family: var(--f-titre); font-weight: 900; font-size: 1.3rem; color: var(--gris); }
.objet-puce.fait { border-color: var(--vert); background: #EAF7F0; }
.objet-puce.fait .chiffre { color: var(--vert); }
.objet-puce.porte { background: var(--encre); color: #fff; border-color: var(--encre); }
.objet-puce.porte .chiffre { color: var(--ambre); }
.voile { position: fixed; inset: 0; z-index: 30; background: rgba(12, 34, 68, .6); display: flex; align-items: flex-end; justify-content: center; padding: 10px; }
@media (min-width: 700px) { .voile { align-items: center; } }
.feuille { position: relative; width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; padding: 16px 18px 20px; animation: monter .22s ease-out; }
@keyframes monter { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.feuille-tete { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.feuille-tete h3 { margin: 0; font-size: 1.3rem; color: var(--encre); }
.fermer { border: 0; background: var(--bureau); width: 38px; height: 38px; border-radius: 50%; font-size: 1rem; }
.intro { color: var(--gris); margin: 6px 0 12px; }
.enigme { position: relative; }
.revele { margin-top: 14px; text-align: center; font-size: 1.05rem; }
.gros-chiffre { display: inline-grid; place-items: center; width: 1.7em; height: 1.7em; border-radius: 12px; background: var(--vert); color: #fff; font-family: var(--f-titre); font-size: 1.8rem; font-weight: 900; vertical-align: middle; margin-left: 6px; }
.deja { text-align: center; font-size: 1.05rem; }
.penalite { position: fixed; left: 50%; top: 80px; transform: translateX(-50%); z-index: 40; background: var(--rouge); color: #fff; font-family: var(--f-titre); font-weight: 800; padding: 6px 14px; border-radius: 20px; animation: monter .2s ease-out; }
.saisie { display: flex; gap: 8px; }
.saisie input { flex: 1; min-width: 0; font: inherit; font-family: var(--f-titre); font-weight: 700; font-size: 1.15rem; text-transform: uppercase; padding: 12px; border: 2px solid #B9CBDB; border-radius: 10px; }
.secoue { animation: secouer .38s; }
@keyframes secouer { 0%, 100% { transform: none; } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.ligne-btn + .btn, .feuille > .btn.discret { margin-top: 14px; }
/* miroir */
.miroir-cadre { background: linear-gradient(135deg, #CFDCE6, #F4F8FB 45%, #C2D1DD); border: 6px solid #9FB4C6; border-radius: 22px; padding: 18px 16px; margin-bottom: 12px; overflow: hidden; }
.miroir-texte { font-family: var(--f-titre); font-weight: 800; font-variation-settings: 'wdth' 100; color: var(--rouge); font-size: 1.05rem; line-height: 1.45; text-align: center; }
.miroir-texte .ligne { display: block; }
.miroir-texte.grand { font-size: 1.3rem; }
.miroir-h .ligne, .brise .ligne.miroir-h { transform: scaleX(-1); }
.miroir-v .ligne { transform: scaleY(-1); }
.brise .ligne.retourne { transform: rotate(180deg); }
.miroir-texte.miroir-h .ligne { transform: scaleX(-1); }
/* memory */
.memory { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 7px; }
.carte-m { position: relative; aspect-ratio: 5 / 4; border: 0; padding: 0; background: none; perspective: 600px; }
.carte-m .dos, .carte-m .face { position: absolute; inset: 0; border-radius: 10px; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform .32s; display: grid; place-items: center; padding: 4px; }
.carte-m .dos { background: var(--encre) repeating-linear-gradient(45deg, transparent 0 8px, rgba(79, 184, 240, .25) 8px 10px); }
.carte-m .face { transform: rotateY(180deg); background: #fff; border: 2px solid #C3D4E3; font-size: clamp(.68rem, 2.9vw, .9rem); line-height: 1.15; text-align: center; hyphens: auto; overflow-wrap: anywhere; }
.carte-m .face.terme { font-family: var(--f-titre); font-weight: 800; color: var(--encre); font-size: clamp(.74rem, 3.2vw, 1rem); }
.carte-m .face.def { color: #33475F; background: #FFFBEA; }
.carte-m.ouverte .dos, .carte-m.trouvee .dos, .carte-m.apercu .dos { transform: rotateY(-180deg); }
.carte-m.ouverte .face, .carte-m.trouvee .face, .carte-m.apercu .face { transform: rotateY(0); }
.carte-m.trouvee .face { border-color: var(--vert); background: #EAF7F0; }
/* pendu */
.ecran-pc { background: var(--encre); color: #fff; border-radius: 12px; padding: 14px; border: 6px solid #0A1C36; }
.indice-mot { margin: 0 0 10px; color: #BFE6FB; font-size: .95rem; }
.mot { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; font-size: 1.2rem; }
.case-l { width: 1.5em; height: 1.85em; display: grid; place-items: center; border-bottom: 3px solid var(--ciel); font-family: var(--f-titre); font-weight: 900; font-size: 1em; }
.case-l.fixe { border-bottom-color: transparent; }
.case-l.vue { animation: apparaitre .25s ease-out; }
@keyframes apparaitre { from { scale: 1.7; opacity: 0; } to { scale: 1; opacity: 1; } }
.mot-groupe { display: inline-flex; gap: inherit; white-space: nowrap; }
.case-l.rate { color: #FF9A92; }
.espace { width: .9em; }
.essais { display: flex; gap: 6px; justify-content: center; margin: 12px 0 0; }
.essais i { width: 18px; height: 18px; border-radius: 4px; background: var(--vert); }
.essais i.grille { background: var(--rouge); }
.clavier { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 10px; }
.cle { padding: 10px 0; border-radius: 8px; border: 2px solid #C3D4E3; background: #fff; font-family: var(--f-titre); font-weight: 800; box-shadow: 0 3px 0 #C3D4E3; }
.cle.bonne { background: var(--vert); color: #fff; border-color: var(--vert); box-shadow: none; }
.cle.mauvaise { background: #F3D3D0; color: #8E241D; border-color: #F3D3D0; box-shadow: none; }
/* scrabble */
.plateau { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; padding: 10px; background: #2E7D5B; border-radius: 10px; }
.case-s { width: 2.5em; height: 2.5em; border-radius: 5px; border: 2px dashed rgba(255, 255, 255, .5); background: #3C8F6A; padding: 0; display: grid; place-items: center; }
.case-s.pleine { border: 0; background: none; }
.case-s.fixe .tuile { box-shadow: 0 0 0 3px var(--ambre); }

/* Questions de calcul générées (UE2), toujours différentes d'une partie à l'autre.
   Chaque générateur rend [niveau, source, question, bonne, faux1, faux2, faux3, explication]. */
const GEN = (() => {
  const P = (x, d = 1) => fmtPct(Math.round(x * 10 ** d) / 10 ** d, d);
  const N = (x, d = 0) => fmtN(Math.round(x * 10 ** d) / 10 ** d, d);
  const J = x => N(x) + NB + 'jours';
  const A = x => N(x, 2) + NB + 'ans';
  function finir(niv, src, q, bonne, faux, expl, r, secours) {
    const vus = new Set([bonne]); const f = [];
    for (const x of faux) if (!vus.has(x)) { vus.add(x); f.push(x); }
    let essai = 0;
    while (f.length < 3 && essai++ < 40) { const x = secours(r); if (!vus.has(x)) { vus.add(x); f.push(x); } }
    return [niv, src, q, bonne, f[0], f[1], f[2], expl];
  }
  const G = {
    actu(r) {
      const t = pick([2, 4, 5, 8, 10, 20], r), v0 = pick([500, 800, 1000, 1200, 1500, 2000, 2500, 5000, 10000], r);
      const v1 = v0 * (1 + t / 100);
      return finir(1, 'F4', `Une somme de ${fmtEur(v1)} sera reçue dans un an. Taux d'actualisation : ${t}${NB}%. Sa valeur aujourd'hui ?`,
        fmtEur(v0), [fmtEur(v1 * (1 + t / 100)), fmtEur(v1 * (1 - t / 100)), fmtEur(v1)],
        `V₀ = ${N(v1, 2)} / ${N(1 + t / 100, 2)} = ${N(v0)}${NB}€.`, r, rr => fmtEur(v0 + pick([-50, -20, 20, 50, 100], rr)));
    },
    rendement(r) {
      const p = pick([20, 25, 40, 50, 80, 100, 120, 200], r), pc = pick([2, 2.5, 3, 4, 5, 6, 8], r), d = p * pc / 100;
      return finir(1, 'F4', `Action achetée ${fmtEur(p)}, dividende annuel ${fmtEur(d)}. Taux de rendement ?`,
        P(pc), [P(pc / 2), P(pc * 2), P(p / d, 0)], `Rendement = ${N(d, 2)} / ${N(p)} = ${P(pc)}.`, r, rr => P(pc + pick([-1, 1, 1.5], rr)));
    },
    detteNette(r) {
      const b = pick([300, 400, 500, 600, 750, 800, 1200], r), t = pick([50, 100, 120, 150, 200, 250], r);
      return finir(1, 'F7', `Dette financière brute ${N(b)} ; trésorerie disponible ${N(t)}. Dette nette ?`,
        N(b - t), [N(b + t), N(t - b), N(b)], `Dette nette = ${N(b)} − ${N(t)} = ${N(b - t)}.`, r, rr => N(b - t + pick([-50, 50, 100], rr)));
    },
    croissance(r) {
      const n1 = pick([400, 500, 600, 800, 1000, 1200, 1500, 2000], r), g = pick([-10, -5, 4, 5, 8, 10, 12, 15, 20, 25], r), n = n1 * (1 + g / 100);
      return finir(1, 'F6', `Chiffre d'affaires : ${N(n1)} en N-1, ${N(n)} en N. Taux de croissance ?`,
        (g > 0 ? '+' : '') + P(g), [(g > 0 ? '+' : '') + P((n - n1) / n * 100), (g > 0 ? '−' : '+') + P(Math.abs(g)), (g > 0 ? '+' : '') + P(g * 10, 0)],
        `(${N(n)} − ${N(n1)}) / ${N(n1)} = ${P(g)}.`, r, rr => '+' + P(Math.abs(g) + pick([2, 3, 5], rr)));
    },
    gearing(r) {
      const cp = pick([400, 500, 800, 1000, 1200, 2000], r), g = pick([20, 25, 30, 40, 50, 60, 75, 80, 120, 150], r), dn = cp * g / 100;
      return finir(1, 'F6', `Dette nette ${N(dn)} ; capitaux propres consolidés ${N(cp)}. Gearing ?`,
        P(g), [P(cp / dn * 100), P(dn / (dn + cp) * 100), P(g / 2)], `Gearing = ${N(dn)} / ${N(cp)} = ${P(g)}.`, r, rr => P(g + pick([-10, 10, 15], rr)));
    },
    roce(r) {
      const ce = pick([500, 800, 1000, 1200, 1500, 2000], r), pc = pick([6, 8, 10, 12, 15, 18, 20, 25], r), e = ce * pc / 100;
      return finir(2, 'F6', `EBIT ${N(e)} ; capitaux employés ${N(ce)}. ROCE ?`,
        P(pc), [P(ce / e, 1), P(pc * 0.75), P(pc * 2)], `ROCE = ${N(e)} / ${N(ce)} = ${P(pc)}.`, r, rr => P(pc + pick([-3, 3, 5], rr)));
    },
    roe(r) {
      const cp = pick([400, 500, 600, 800, 1000, 1600], r), pc = pick([5, 8, 10, 12.5, 15, 20], r), rn = cp * pc / 100;
      return finir(2, 'F6', `Résultat net part du groupe ${N(rn, 1)} ; capitaux propres part du groupe ${N(cp)}. ROE ?`,
        P(pc), [P(cp / rn, 1), P(pc / 2), P(pc + 5)], `ROE = ${N(rn, 1)} / ${N(cp)} = ${P(pc)}.`, r, rr => P(pc + pick([-2, 2, 3], rr)));
    },
    rentab(r) {
      const v0 = pick([40, 50, 80, 100, 200], r), hausse = pick([-10, -5, 5, 10, 20], r), d = v0 * pick([2, 4, 5], r) / 100, v1 = v0 * (1 + hausse / 100);
      const R = (v1 + d - v0) / v0 * 100;
      return finir(2, 'F4', `Action : ${fmtEur(v0)} en début d'année, ${fmtEur(v1)} en fin d'année, dividende ${fmtEur(d)}. Rentabilité ?`,
        P(R), [P(hausse), P(d / v0 * 100), P((v1 + d - v0) / v1 * 100)], `(${N(v1, 2)} + ${N(d, 2)} − ${N(v0)}) / ${N(v0)} = ${P(R)}.`, r, rr => P(R + pick([-2, 2, 4], rr)));
    },
    delaiClients(r) {
      const ca = pick([720, 1080, 1440, 1800, 2160, 2880, 3600], r), j = pick([15, 20, 30, 36, 40, 45, 60, 72, 90], r), c = ca * j / 360;
      return finir(2, 'F6', `Clients et EENE ${N(c)} ; CA TTC ${N(ca)}. Durée moyenne du crédit clients ?`,
        J(j), [J(c / ca * 12), J(j * 2), J(ca / c)], `${N(c)} / ${N(ca)} × 360 = ${N(j)} jours.`, r, rr => J(j + pick([-10, 10, 15], rr)));
    },
    capRemb(r) {
      const caf = pick([50, 80, 100, 120, 150, 200], r), a = pick([1.5, 2, 2.5, 3, 4, 5, 6], r), dn = caf * a;
      return finir(2, 'F6', `Endettement financier net ${N(dn)} ; CAF ${N(caf)}. Capacité de remboursement ?`,
        A(a), [A(caf / dn), A(a * 2), A(a + 1)], `${N(dn)} / ${N(caf)} = ${N(a, 2)} ans (seuil bancaire : 3 à 4 ans).`, r, rr => A(a + pick([-0.5, 0.5, 1.5], rr)));
    },
    roic(r) {
      const ic = pick([600, 900, 1200, 1500, 2400, 3000], r), pc = pick([5, 10, 15, 20], r), nopat = ic * pc / 100, ebit = nopat / 0.75;
      const imm = ic - pick([100, 200], r);
      return finir(3, 'F6', `EBIT ${N(ebit)} ; IS 25${NB}% ; immobilisations nettes ${N(imm)} ; BFR ${N(ic - imm)}. ROIC ?`,
        P(pc), [P(ebit / ic * 100), P(nopat / imm * 100), P(ebit * 0.25 / ic * 100)],
        `NOPAT = ${N(ebit)} × 0,75 = ${N(nopat)} ; ${N(nopat)} / ${N(ic)} = ${P(pc)}.`, r, rr => P(pc + pick([-2, 2, 4], rr)));
    },
    mee(r) {
      const pc = pick([20, 25, 30, 35, 40, 45], r), cp = pick([400, 500, 600, 800, 1000, 1200, 2000], r);
      return finir(3, 'F5', `Le groupe détient ${pc}${NB}% d'une société (influence notable) dont les capitaux propres sont de ${N(cp)}. Titres mis en équivalence ?`,
        N(cp * pc / 100), [N(cp), N(cp * (100 - pc) / 100), N(cp * pc / 100 / 2)], `${pc}${NB}% × ${N(cp)} = ${N(cp * pc / 100)}.`, r, rr => N(cp * pc / 100 + pick([-50, 50, 100], rr)));
    },
    decompo(r) {
      const m = pick([4, 5, 6, 8, 10, 12, 15], r), rot = pick([0.8, 1, 1.2, 1.5, 2, 2.5], r);
      return finir(3, 'F6', `Taux de profitabilité ${P(m, 0)} ; rotation des capitaux engagés ${N(rot, 1)}. ROCE ?`,
        P(m * rot), [P(m + rot), P(m / rot), P(m)], `ROCE = ${P(m, 0)} × ${N(rot, 1)} = ${P(m * rot)}.`, r, rr => P(m * rot + pick([-2, 2, 3], rr)));
    },
    fournisseurs(r) {
      const ach = pick([720, 1080, 1440, 1800], r), j = pick([30, 40, 45, 60, 75, 90], r), f = ach * j / 360;
      return finir(3, 'F6', `Fournisseurs ${N(f)} ; achats et services extérieurs TTC ${N(ach)}. Crédit fournisseurs ?`,
        J(j), [J(f / ach * 12), J(ach / f), J(j / 2)], `${N(f)} / ${N(ach)} × 360 = ${N(j)} jours.`, r, rr => J(j + pick([-15, 15, 20], rr)));
    },
    detteAjustee(r) {
      const b = pick([400, 500, 600, 800, 1000], r), t = pick([150, 200, 250, 300], r), libre = pick([20, 30, 50, 60, 80], r);
      return finir(4, 'F7', `Dette brute ${N(b)} ; trésorerie ${N(t)}, dont seulement ${N(libre)} réellement libres (avances clients, cash captif). Dette ajustée ?`,
        N(b - libre), [N(b - t), N(b + libre), N(b - t + libre)], `On ne retranche que le cash libre : ${N(b)} − ${N(libre)} = ${N(b - libre)}.`, r, rr => N(b - libre + pick([-40, 40, 60], rr)));
    },
    vecp(r) {
      const ve = pick([2000, 2500, 3000, 4000, 5000], r), b = pick([600, 800, 900, 1200], r), t = pick([100, 200, 300], r);
      return finir(4, 'F7', `Valeur d'entreprise ${N(ve)} ; dette brute ${N(b)} ; trésorerie libre ${N(t)}. Valeur des capitaux propres ?`,
        N(ve - (b - t)), [N(ve - b), N(ve + b - t), N(ve - b - t)], `Dette nette ${N(b - t)} ; ${N(ve)} − ${N(b - t)} = ${N(ve - b + t)}.`, r, rr => N(ve - b + t + pick([-100, 100, 200], rr)));
    },
    organique(r) {
      const n1 = pick([1000, 1200, 1500, 2000], r), g = pick([-4, -2, 2, 3, 5], r), acq = pick([60, 80, 100, 120, 150], r), n = n1 * (1 + g / 100) + acq;
      const s = x => (x > 0 ? '+' : x < 0 ? '−' : '') + P(Math.abs(x));
      return finir(4, 'F5', `CA : ${N(n1)} en N-1, ${N(n)} en N, dont ${N(acq)} apportés par une acquisition de l'année. Croissance à périmètre constant ?`,
        s(g), [s((n - n1) / n1 * 100), s(-g), s((n - n1) / n * 100)], `(${N(n)} − ${N(acq)} − ${N(n1)}) / ${N(n1)} = ${s(g)}.`, r, rr => s(g + pick([-3, 3, 6], rr)));
    },
    actu2(r) {
      const t = pick([5, 10, 20], r), v0 = pick([1000, 2000, 5000], r), v2 = v0 * (1 + t / 100) ** 2;
      return finir(4, 'F4', `${fmtEur(v2)} seront reçus dans 2 ans. Taux d'actualisation : ${t}${NB}%. Valeur actuelle ?`,
        fmtEur(v0), [fmtEur(v2 / (1 + t / 100)), fmtEur(v2 * (1 - 2 * t / 100)), fmtEur(v2 / (1 + 2 * t / 100))],
        `V₀ = ${N(v2, 2)} / ${N(1 + t / 100, 2)}² = ${N(v0)}${NB}€.`, r, rr => fmtEur(v0 + pick([-30, 30, 60], rr)));
    }
  };
  const PAR_NIVEAU = {
    1: ['actu', 'rendement', 'detteNette', 'croissance', 'gearing'],
    2: ['actu', 'detteNette', 'gearing', 'roce', 'roe', 'rentab', 'delaiClients', 'capRemb'],
    3: ['roce', 'rentab', 'delaiClients', 'capRemb', 'roic', 'mee', 'decompo', 'fournisseurs'],
    4: ['roic', 'mee', 'decompo', 'fournisseurs', 'detteAjustee', 'vecp', 'organique', 'actu2']
  };
  return { G, PAR_NIVEAU, creer(niv, r) { return G[pick(PAR_NIVEAU[niv], r)](r); } };
})();

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const NB = ' ';

function rngFrom(seed) {
  let a = (seed >>> 0) || 1;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

  bip(f = 660, d = 0.12, type = 'sine', v = 0.18, delai = 0) {

      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);

  },

function lireConfig() {

  if (c && c.databaseURL) return { cfg: c, origine: 'appareil' };

function cfgEnLien(c) {

function analyserConfig(txt) {

/* ================== RÉSEAU ==================
   Deux moteurs avec la même interface :
   - Firebase Realtime Database (jeu en ligne, QR code, plusieurs appareils)
   - Local (plusieurs onglets du même navigateur, pour essayer sans connexion) */
const chemin = p => String(p).split('/').filter(Boolean);
function lireA(arbre, p) { let n = arbre; for (const k of chemin(p)) { if (n == null || typeof n !== 'object') return null; n = n[k]; } return n === undefined ? null : n; }
function ecrireA(arbre, p, v) {
  const ks = chemin(p); if (!ks.length) return (v && typeof v === 'object') ? JSON.parse(JSON.stringify(v)) : {};
  let n = arbre;
  for (let i = 0; i < ks.length - 1; i++) { if (n[ks[i]] == null || typeof n[ks[i]] !== 'object') n[ks[i]] = {}; n = n[ks[i]]; }
  const der = ks[ks.length - 1];
  if (v === null || v === undefined) delete n[der]; else n[der] = JSON.parse(JSON.stringify(v));
  return arbre;
}
function nettoyerA(n) {
  if (n && typeof n === 'object') { for (const k of Object.keys(n)) { n[k] = nettoyerA(n[k]); if (n[k] === null || (typeof n[k] === 'object' && !Object.keys(n[k]).length)) delete n[k]; } }
  return n;
}

const NetLocal = {
  type: 'local', uid: null, ecoutes: [], canal: null,
  async init() {
    let id = null; try { id = sessionStorage.getItem('mlive:uid'); } catch (e) { }
    if (!id) { id = 'L' + Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem('mlive:uid', id); } catch (e) { } }
    this.uid = id;
    try { this.canal = new BroadcastChannel('mlive'); this.canal.onmessage = () => this.notifier(); } catch (e) { }
    window.addEventListener('storage', e => { if (e.key === 'mlive:db') this.notifier(); });
    return this.uid;
  },
  arbre() { return store.get('db', {}) || {}; },
  ecrire(fn) {
    const faire = () => { const a = this.arbre(); fn(a); nettoyerA(a); store.set('db', a); this.notifier(); if (this.canal) this.canal.postMessage(1); };
    if (navigator.locks && navigator.locks.request) return navigator.locks.request('mlive-db', faire);
    faire(); return Promise.resolve();
  },
  notifier() {
    const a = this.arbre();
    for (const e of this.ecoutes) { const v = lireA(a, e.p); const s = JSON.stringify(v); if (s !== e.der) { e.der = s; try { e.cb(v); } catch (x) { } } }
  },
  now() { return Date.now(); },
  async get(p) { return lireA(this.arbre(), p); },
  set(p, v) { return this.ecrire(a => ecrireA(a, p, v)); },
  update(p, obj) { return this.ecrire(a => { for (const [k, v] of Object.entries(obj)) ecrireA(a, p + '/' + k, v); }); },
  remove(p) { return this.ecrire(a => ecrireA(a, p, null)); },
  async push(p, v) { const k = 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); await this.set(p + '/' + k, v); return k; },
  on(p, cb) {
    const e = { p, cb, der: undefined }; this.ecoutes.push(e);
    setTimeout(() => { const v = lireA(this.arbre(), p); e.der = JSON.stringify(v); cb(v); }, 0);
    return () => { this.ecoutes = this.ecoutes.filter(x => x !== e); };
  },
  surDeconnexion() { },
  horodatage() { return Date.now(); },
  async top(p, n) {
    const v = await this.get(p) || {};
    return Object.values(v).sort((a, b) => b.k - a.k).slice(0, n);
  }
};

const NetFirebase = {
  type: 'firebase', uid: null, db: null, decalage: 0, F: null,
  async init(cfg) {
    const F = this.F = window.FBSDK;
    const app = F.initializeApp(cfg, 'memorall-live');
    const auth = F.getAuth(app);
    this.db = F.getDatabase(app, cfg.databaseURL);
    await new Promise((ok, ko) => {
      const fin = F.onAuthStateChanged(auth, u => { if (u) { this.uid = u.uid; fin(); ok(); } });
      F.signInAnonymously(auth).catch(e => { fin(); ko(e); });
      setTimeout(() => ko(new Error('délai dépassé')), 15000);
    });
    F.onValue(F.ref(this.db, '.info/serverTimeOffset'), s => { this.decalage = s.val() || 0; });
    return this.uid;
  },
  r(p) { return this.F.ref(this.db, p); },
  now() { return Date.now() + this.decalage; },
  async get(p) { const s = await this.F.get(this.r(p)); return s.exists() ? s.val() : null; },
  set(p, v) { return this.F.set(this.r(p), v); },
  update(p, obj) { return this.F.update(this.r(p), obj); },
  remove(p) { return this.F.remove(this.r(p)); },
  async push(p, v) { const r = this.F.push(this.r(p)); await this.F.set(r, v); return r.key; },
  on(p, cb) { return this.F.onValue(this.r(p), s => cb(s.val()), () => { }); },
  surDeconnexion(p, v) { try { this.F.onDisconnect(this.r(p)).set(v); } catch (e) { } },
  horodatage() { return this.F.serverTimestamp(); },
  async top(p, n) {
    const s = await this.F.get(this.F.query(this.r(p), this.F.orderByChild('k'), this.F.limitToLast(n)));
    const out = []; s.forEach(c => { out.push(c.val()); });
    return out.sort((a, b) => b.k - a.k);
  }
};

/* Serveur Memorall (Cloudflare) : utilisé automatiquement quand la page est servie par lui */
const NetServeur = {
  type: 'serveur', uid: null, secret: null, decalage: 0, conns: {},
  async init() {
    const r = await fetch(this.url('api/ping'), { cache: 'no-store' });
    const d = await r.json();
    if (d.service !== 'defi-dscg') throw new Error('serveur absent');
    this.decalage = d.now - Date.now();
    let ident = store.get('ident', null);
    if (!ident) { ident = { id: 'u' + Math.random().toString(36).slice(2, 12), secret: [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('') }; store.set('ident', ident); }
    this.uid = ident.id; this.secret = ident.secret;
    return this.uid;
  },
  url(rel) { return new URL(rel, location.href.split('#')[0].split('?')[0]).href; },
  now() { return Date.now() + this.decalage; },
  decoupe(p) { const ks = chemin(p); return ks[0] === 'salons' && /^\d{4}$/.test(ks[1] || '') ? { code: ks[1], rel: ks.slice(2).join('/') } : { ks }; },
  conn(code) {
    if (this.conns[code]) return this.conns[code];
    const c = this.conns[code] = { ws: null, file: [], attente: {}, n: 0, abos: new Map(), departs: new Map(), ouvert: false };
    const ouvrir = () => {
      const ws = c.ws = new WebSocket(this.url(`ws/${code}?id=${this.uid}&secret=${this.secret}`).replace(/^http/, 'ws'));
      ws.onopen = () => {
        c.ouvert = true;
        for (const p of c.abos.keys()) ws.send(JSON.stringify({ t: 'abo', p }));
        for (const [p, v] of c.departs) ws.send(JSON.stringify({ t: 'depart', p, v }));
        const f = c.file; c.file = []; f.forEach(m => ws.send(m));
      };
      ws.onmessage = e => {
        let m; try { m = JSON.parse(e.data); } catch (x) { return; }
        if (m.t === 'bonjour') this.decalage = m.now - Date.now();
        else if (m.t === 'val') { const fs = c.abos.get(m.p); if (fs) fs.forEach(f => { try { f(m.v); } catch (x) { } }); }
        else if (m.t === 'res' && c.attente[m.r]) { const [ok, ko] = c.attente[m.r]; delete c.attente[m.r]; m.err ? ko(new Error(m.err)) : ok(m.v ?? null); }
      };
      ws.onclose = () => { c.ouvert = false; if (this.conns[code] === c) setTimeout(ouvrir, 1200); };
    };
    ouvrir();
    return c;
  },
  envoyer(code, m, reponse = true) {
    const c = this.conn(code);
    return new Promise((ok, ko) => {
      if (reponse) { m.r = ++c.n; c.attente[m.r] = [ok, ko]; } else ok();
      const s = JSON.stringify(m);
      if (c.ouvert && c.ws.readyState === 1) c.ws.send(s); else c.file.push(s);
    });
  },
  async get(p) {
    const d = this.decoupe(p);
    if (!d.code) return null;
    const r = await fetch(this.url(`api/salon/${d.code}?p=${encodeURIComponent(d.rel)}`), { cache: 'no-store' });
    return (await r.json()).v ?? null;
  },
  set(p, v) { const d = this.decoupe(p); return this.envoyer(d.code, { t: 'set', p: d.rel, v: propre(v) }); },
  update(p, obj) { const d = this.decoupe(p); return this.envoyer(d.code, { t: 'update', p: d.rel, v: propre(obj) }); },
  async remove(p) {
    const d = this.decoupe(p);
    await this.envoyer(d.code, { t: 'remove', p: d.rel });
    if (!d.rel) { const c = this.conns[d.code]; delete this.conns[d.code]; if (c && c.ws) c.ws.close(); }
  },
  async push(p, v) {
    const d = this.decoupe(p);
    if (d.ks && d.ks[0] === 'records') {
      await fetch(this.url(`api/records/${d.ks[1]}/${d.ks[2]}`), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ p: v.p, k: v.k, x: v.x }) });
      return null;
    }
    const k = 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await this.set(p + '/' + k, v); return k;
  },
  on(p, cb) {
    const d = this.decoupe(p), c = this.conn(d.code), rel = chemin(d.rel).join('/');
    if (!c.abos.has(rel)) { c.abos.set(rel, new Set()); this.envoyer(d.code, { t: 'abo', p: rel }, false); }
    c.abos.get(rel).add(cb);
    return () => {
      const fs = c.abos.get(rel); if (!fs) return;
      fs.delete(cb);
      if (!fs.size) { c.abos.delete(rel); if (c.ouvert) c.ws.send(JSON.stringify({ t: 'desabo', p: rel })); }
    };
  },
  surDeconnexion(p, v) { const d = this.decoupe(p), c = this.conn(d.code); c.departs.set(d.rel, v); this.envoyer(d.code, { t: 'depart', p: d.rel, v }).catch(() => { }); },
  horodatage() { return { '.sv': 'timestamp' }; },
  async top(p, n) {
    const ks = chemin(p);
    const r = await fetch(this.url(`api/records/${ks[1]}/${ks[2]}?n=${n}`), { cache: 'no-store' });
    return (await r.json()).v || [];
  }
};

    const barre = $('#q-chrono', this.racine);
    const boucle = () => {
      if (this.fini || this.verrou) return;
      const reste = 1 - (performance.now() - this.t0) / this.duree;
      barre.style.transform = `scaleX(${Math.max(0, reste)})`;
      barre.classList.toggle('urgent', reste < 0.3);
      if (reste <= 0) { this.repondre(-1); return; }
      this.raf = requestAnimationFrame(boucle);
    };
    this.raf = requestAnimationFrame(boucle);
  }
  clavier(e) {
    if (this.verrou || this.fini) return;
    const k = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 }[e.key.toLowerCase()];
    if (k !== undefined) this.repondre(k);
  }
  repondre(k) {
    if (this.verrou || this.fini) return;
    this.verrou = true; cancelAnimationFrame(this.raf);
    const dt = Math.min(this.duree, performance.now() - this.t0);
    const carte = $('#q-carte', this.racine);
    const boutons = $$('.touche', carte);
    boutons.forEach(b => b.disabled = true);
    if (k === this.bonneIndex) {
      this.serie++; this.tempsTotal += dt;
      this.points += 100 + Math.round(50 * (1 - dt / this.duree));
      boutons[k].classList.add('juste');
      $('#q-serie', this.racine).textContent = this.serie;
      $('#q-serie', this.racine).nextElementSibling.textContent = this.serie > 1 ? 'bonnes réponses d’affilée' : 'bonne réponse d’affilée';
      $('#q-pts', this.racine).textContent = fmtN(this.points);
      this.tampon(carte, 'Validé', 'vert');
      Son.ok();
      this.rapport({ statut: 'jeu', k: this.cle(), score: this.serie, info: `${this.serie} ✓` });
      this.plus_tard(() => this.suivante(), 700);
    } else {
      this.tempsTotal += dt;
      if (k >= 0) boutons[k].classList.add('faux');
      boutons[this.bonneIndex].classList.add('juste');
      this.tampon(carte, k < 0 ? 'Temps écoulé' : 'Éliminé', 'rouge');
      Son.ko();
      this.erreur = { q: this.q[2], bonne: this.q[3], choisie: k >= 0 ? boutons[k].lastElementChild.textContent : null, expl: this.q[7] };
      const ex = document.createElement('div'); ex.className = 'explication';
      ex.innerHTML = `<p><b>Bonne réponse :</b> ${esc(this.q[3])}</p><p>${esc(this.q[7])}</p><button class="btn principal" id="q-fin">Voir mon résultat</button>`;
      carte.appendChild(ex);
      $('#q-fin', carte).addEventListener('click', () => this.cloturer('elimine'));
      this.rapport({ statut: 'elimine', k: this.cle(), score: this.serie, info: `${this.serie} ✓` }, true);
      this.plus_tard(() => this.cloturer('elimine'), 9000);
    }
  }
  cle() { return this.serie * 1e7 + (1e7 - Math.min(9999999, Math.round(this.tempsTotal / 10))); }
  cloturer(statut) {
    const s = this.serie;
    this.terminer({
      k: this.cle(), statut,
      titre: s === 0 ? 'Aucune bonne réponse' : `${s} bonne${s > 1 ? 's' : ''} réponse${s > 1 ? 's' : ''} d’affilée`,
      sous: `${fmtN(this.points)} points en ${fmtDuree(this.tempsTotal)}`,
      score: s, detail: `${s} ✓ en ${fmtDuree(this.tempsTotal)}`, info: `${s} ✓`,
      erreur: this.erreur
    });
  }
  stop() { if (!this.fini) this.cloturer(this.verrou && this.erreur ? 'elimine' : 'fini'); }
}

    if (this.fini) return;
    const s = this.stats();
    this.rapport({ statut: 'fini', k: this.cle(), score: Math.max(0, this.points), info: `${fmtN(s.pct, 0)}${NB}%`, prog: 1 }, true);
    const erreurs = this.res.filter(x => x.r === 'manque' || x.r === 'fausse');
    this.terminer({
      k: this.cle(), statut: 'fini',
      titre: `${fmtN(s.pct, 0)}${NB}% de bonnes réponses`,
      sous: `${fmtN(Math.max(0, this.points))} points, temps de réaction moyen ${s.vit ? fmtN(s.vit / 1000, 2) + NB + 's' : '–'}`,
      score: Math.max(0, this.points), detail: `${fmtN(Math.max(0, this.points))} pts, ${fmtN(s.pct, 0)}${NB}%, ${s.vit ? fmtN(s.vit / 1000, 2) + NB + 's' : '–'}`, info: `${fmtN(s.pct, 0)}${NB}%`,
      pct: s.pct, vit: s.vit, n: s.n, bons: s.bons, erreurs
    });
  }
  stop() { this.cloturer(); }
}

function qrSVG(texte) {
  const q = QRGEN.default(0, 'M'); q.addData(texte); q.make();
  const n = q.getModuleCount(), m = 3; let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges" role="img" aria-label="QR code pour rejoindre le salon"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#12305A"/></svg>`;
}

function lienSalon(code) {
  const { cfg, origine } = lireConfig();
  return baseURL() + (cfg && origine !== 'fichier' ? '?cfg=' + cfgEnLien(cfg) : '') + '#' + code;
}
function codeDansAdresse() {
  const q = new URLSearchParams(location.search);
  const brut = q.get('salon') || q.get('s') || (location.search.match(/^\?(\d{4})$/) || [])[1] || (location.hash.match(/^#(\d{4})$/) || [])[1];
  return brut && /^\d{4}$/.test(brut) ? brut : null;
}

async function hoteCreer() {
  afficher('<section class="attente-centre"><p>Ouverture du salon…</p></section>');
  let code = null;
  for (let i = 0; i < 12; i++) {
    const c = String(1000 + Math.floor(Math.random() * 9000));
    if (!(await Net.get(`salons/${c}/hote`))) { code = c; break; }
  }
  if (!code) { bulle('Impossible de créer un salon, réessayez.'); return accueil(); }
  try {
    await Net.set(`salons/${code}`, { hote: Net.uid, cree: Net.horodatage(), etat: { phase: 'salon', n: 0 } });
  } catch (e) { return erreurReseau(e); }
  store.set('hote', { code });
  hoteOuvrir(code);
}
async function hoteReprendre(code) {
  const h = await Net.get(`salons/${code}/hote`);
  if (h !== Net.uid) { store.del('hote'); bulle('Ce salon n’existe plus ou a été ouvert sur un autre appareil.'); return accueil(); }
  hoteOuvrir(code);
}
function erreurReseau(e) {
  const m = String(e && (e.code || e.message) || e);
  afficher(`<section class="attente-centre"><p class="alerte">La base de données a refusé l’opération (${esc(m)}). Vérifiez les règles de sécurité (voir le guide), puis réessayez.</p><button class="btn principal" id="ok">Retour</button></section>`);
  $('#ok').addEventListener('click', accueil);
}
function hoteOuvrir(code) {
  quitterSession();
  const H = APP.H = { code, joueurs: {}, etat: {}, res: {}, tournoi: {}, choixJeu: store.get('choixJeu', 'qcm'), choixNiv: store.get('choixNiv', 1), abos: [], vue: null, lignes: {} };
  contexte(`Salon ${code}`);
  const base = `salons/${code}`;
  H.abos.push(Net.on(base + '/joueurs', v => { H.joueurs = v || {}; if (H.vue === 'salon') hoteMajJoueurs(); }));
  H.abos.push(Net.on(base + '/tournoi', v => { H.tournoi = v || {}; }));
  H.abos.push(Net.on(base + '/etat', v => {
    if (!v) { if (APP.H === H) { store.del('hote'); accueil(); bulle('Salon fermé.'); } return; }
    const avant = H.etat; H.etat = v;
    if (v.phase === 'salon') { if (H.vue !== 'salon') hoteSalon(); }
    else if (v.phase === 'jeu') { if (H.vue !== 'live' || avant.partie !== v.partie) hoteLive(); }
    else if (v.phase === 'resultats') { if (H.vue !== 'podium') hotePodium(); }
  }));
}

function hoteTic() {

}
function visuelLigne(jeu, r) {

function hoteMajClassement() {

async function joueurEntrer(code, pseudoVoulu) {
  afficher('<section class="attente-centre"><p>Connexion au salon…</p></section>');
  const base = `salons/${code}`;
  try {
    if (!(await Net.get(base + '/hote'))) { bulle('Ce salon n’existe pas ou a été fermé.'); return ecranRejoindre(''); }
    if (await Net.get(`${base}/exclus/${Net.uid}`)) { bulle('L’animateur vous a retiré de ce salon.'); return accueil(); }
    const js = (await Net.get(base + '/joueurs')) || {};
    const pris = new Set(Object.entries(js).filter(([u]) => u !== Net.uid).map(([, j]) => norm(j.pseudo)));
    let p = pseudoVoulu, i = 2; while (pris.has(norm(p))) p = pseudoVoulu.slice(0, 13) + ' ' + i++;
    await Net.set(`${base}/joueurs/${Net.uid}`, { pseudo: p, arrivee: Net.horodatage(), en_ligne: true });
    Net.surDeconnexion(`${base}/joueurs/${Net.uid}/en_ligne`, false);
    APP.pseudo = pseudoVoulu; store.set('pseudo', pseudoVoulu);
    sess.set('joueur', { code, pseudo: pseudoVoulu });
    history.replaceState(null, '', baseURL() + '#' + code);
    joueurSession(code, p);
  } catch (e) { erreurReseau(e); }
}
const nbJ = n => `${n} joueur${n > 1 ? 's' : ''} connecté${n > 1 ? 's' : ''}`;
function joueurSession(code, pseudo) {
  quitterSession();

  contexte(`${pseudo}, salon ${code}`);

  J.abos.push(Net.on(`${base}/joueurs/${Net.uid}`, v => {
    if (v) { J.present = true; if (v.en_ligne === false) Net.update(`${base}/joueurs/${Net.uid}`, { en_ligne: true }).catch(() => { }); return; }
    if (J.present && APP.J === J) {

  }));

async function joueurEtat(J, e) {
  if (APP.J !== J) return;
  const avant = J.etat; J.etat = e;
  if (!e) {
    quitterSession(); sess.del('joueur');
    afficher(`<section class="attente-centre"><p>Le salon ${esc(J.code)} est fermé. Merci d’avoir joué !</p><button class="btn principal" id="ok">Accueil</button></section>`);
    return $('#ok').addEventListener('click', accueil);
  }
  if (e.phase === 'salon') { if (!avant || avant.phase !== 'salon' || !$('.attente-joueur')) joueurAttente(J); return; }
  if (e.phase === 'jeu') {
    if (J.partie === e.partie) return;
    J.partie = e.partie;
    const deja = await Net.get(`salons/${J.code}/parties/${e.partie}/res/${Net.uid}`);
    if (deja && deja.statut !== 'jeu') return joueurAttente(J, 'Vous avez déjà joué cette partie. Attendez la suivante.');
    return joueurPartie(J, e);
  }
  if (e.phase === 'resultats') {
    if (APP.jeu && !APP.jeu.fini) APP.jeu.stop();
    setTimeout(() => { if (APP.J === J && J.etat === e) joueurResultat(J, e); }, 600);
  }
}

function joueurPartie(J, e) {

  tic();
}
function joueurApresPartie(J, res) {
  arreterJeu();
  afficher(`
    <section class="fin">
      <div class="resultat papier">
        <p class="petit-titre">${JEUX[res.jeu].nom}, niveau ${nomNiveau(res.niveau)}</p>
        <h1>${esc(res.titre)}</h1>
        <p class="sous">${esc(res.sous)}</p>
        <p class="rang-live" id="rang-live">Calcul du classement…</p>
        ${blocErreurs(res)}
      </div>
      <p class="attente-anim">Les résultats définitifs s’afficheront à la fin de la partie.</p>
    </section>`);
  const partie = J.partie;
  const majRang = async () => {
    const el = $('#rang-live'); if (!el || APP.J !== J || J.partie !== partie) return clearInterval(J.minuteur);
    const v = await Net.get(`salons/${J.code}/parties/${partie}/res`).catch(() => null);
    if (!v || !el.isConnected) return;
    const l = Object.entries(v).sort((a, b) => (b[1].k || 0) - (a[1].k || 0));
    const i = l.findIndex(([u]) => u === Net.uid);
    const enJeu = l.filter(([, r]) => r.statut === 'jeu').length;
    el.innerHTML = i >= 0 ? `Classement provisoire : <b>${i + 1}<sup>${i ? 'e' : 'er'}</sup></b> sur ${l.length}${enJeu ? ` (${enJeu} encore en jeu)` : ''}` : '';
  };
  if (J.minuteur) clearInterval(J.minuteur);
  majRang(); J.minuteur = setInterval(majRang, 4000);
}
async function joueurResultat(J, e) {
  arreterJeu();
  const classes = (await Net.get(`salons/${J.code}/parties/${e.partie}/classement`)) || [];
  if (APP.J !== J) return;
  const i = classes.findIndex(c => c.uid === Net.uid);
  const res = J.partie === e.partie ? J.resultat : null;
  afficher(`
    <section class="fin">
      <div class="resultat papier">
        ${i === 0 ? '<div class="tampon vert fixe">Vainqueur</div>' : ''}
        <p class="petit-titre">${JEUX[e.jeu].nom}, niveau ${nomNiveau(e.niveau)}</p>
        <h1>${i >= 0 ? `${i + 1}<sup>${i ? 'e' : 'er'}</sup> sur ${classes.length}` : 'Partie terminée'}</h1>
        ${res ? `<p class="sous">${esc(res.titre)}. ${esc(res.sous)}</p>` : ''}
        ${classes.length ? `<ol class="records court">${classes.slice(0, 5).map((c, k) => `<li class="${c.uid === Net.uid ? 'moi' : ''}"><span class="rang">${k + 1}</span>${pastille(c.p)}<span class="nom">${esc(c.p)}</span><span class="val">${esc(c.info || '')}</span></li>`).join('')}</ol>` : ''}
        ${res ? blocErreurs(res) : ''}
      </div>
      <p class="attente-anim">En attente de la prochaine partie…</p>
    </section>`);
  if (i === 0) { Son.gong(); confettis(); }
}

/* ================== RÉGLAGES DE LA CONNEXION ================== */
function reglages() {
  contexte('Connexion en ligne');
  const { cfg, origine } = lireConfig();
  if (Net && Net.type === 'serveur') {
    afficher(`<section class="page-reglages"><button class="retour" id="retour">← Accueil</button><h1 class="titre-page">Connexion en ligne</h1>
      <p class="ok-txt">Connexion en ligne active : le site tourne sur le serveur Memorall. Rien à configurer, les joueurs rejoignent avec le QR code, l’adresse et le code, ou le lien direct.</p></section>`);
    return $('#retour').addEventListener('click', accueil);
  }
  const etat = enLigne()
    ? `<p class="ok-txt">Connexion en ligne active (projet ${esc(cfg.projectId || cfg.databaseURL)}). Les joueurs peuvent rejoindre depuis leur téléphone.</p>`
    : `<p class="alerte">${NET_ERREUR ? `La connexion a échoué : ${esc(NET_ERREUR)}.` : 'Aucune connexion en ligne configurée : le direct ne fonctionne qu’entre onglets de ce navigateur.'}</p>`;
  const aideErreur = /operation-not-allowed|admin-restricted/.test(NET_ERREUR || '') ? '<p class="aide-txt fort">Dans la console Firebase, ouvrez Authentication, onglet « Sign-in method », et activez le fournisseur « Anonyme ».</p>' : '';
  afficher(`
    <section class="page-reglages">
      <button class="retour" id="retour">← Accueil</button>
      <h1 class="titre-page">Connexion en ligne</h1>
      ${etat}${aideErreur}
      <div class="papier formulaire">
        <p>Le jeu en direct s’appuie sur une base Firebase Realtime Database. La configuration se colle de préférence dans le fichier lui-même (bloc CONFIG en haut du code). Pour un essai rapide, vous pouvez aussi la coller ici : elle sera enregistrée sur cet appareil et transmise aux joueurs par le QR code.</p>
        <label class="champ">Configuration Firebase (bloc firebaseConfig)
          <textarea id="cfg" rows="8" spellcheck="false">${cfg && origine !== 'fichier' ? esc(JSON.stringify(cfg, null, 2)) : ''}</textarea></label>
        <div class="ligne-btn">
          ${origine === 'appareil' || origine === 'lien' ? '<button class="btn discret" id="cfg-effacer">Retirer de cet appareil</button>' : ''}
          <button class="btn principal" id="cfg-ok">Enregistrer et redémarrer</button>
        </div>
        ${origine === 'fichier' ? '<p class="aide-txt">La configuration actuelle est inscrite dans le fichier.</p>' : ''}
      </div>
    </section>`);
  $('#retour').addEventListener('click', accueil);
  $('#cfg-ok').addEventListener('click', () => {
    const c = analyserConfig($('#cfg').value);
    if (!c) return bulle('Configuration incomplète : il faut au moins apiKey et databaseURL.');
    store.set('cfg', c); location.href = baseURL();
  });
  const ef = $('#cfg-effacer'); if (ef) ef.addEventListener('click', () => { store.del('cfg'); location.href = baseURL(); });
}
function mentions() {
  boite(`<h2 class="titre-page">Mentions légales</h2>
    <p><b>Éditeur :</b> MEMORALL SAS, SIREN 943 720 250, 3 rue Cassette, 75006 Paris.</p>
    <p><b>Directeur de la publication :</b> Florian Manicardi.</p>
    ${CONFIG.hebergeur ? `<p><b>Hébergement :</b> ${esc(CONFIG.hebergeur)}</p>` : ''}
    <p><b>Contact :</b> <a href="mailto:${esc(CONFIG.contact)}">${esc(CONFIG.contact)}</a></p>
    <p><b>Données :</b> aucun compte n’est créé. En partie en direct, seuls le pseudo choisi et les scores sont enregistrés le temps de la session ; les records restent sur l’appareil ou, s’ils sont publiés en ligne, se limitent au pseudo et au score.</p>
    <p><b>Contenus :</b> questions rédigées par Memorall à partir des supports de cours DSCG UE1 et UE2.</p>`);
}

/* ================== DÉMARRAGE ================== */
async function lancerAppli() {
  cadre();
  afficher('<section class="attente-centre"><p>Chargement…</p></section>');
  await demarrerReseau();
  const code = codeDansAdresse();
  if (code) {
    const mem = sess.get('joueur', null);
    if (mem && mem.code === code && mem.pseudo) return joueurEntrer(code, mem.pseudo);
    return ecranRejoindre(code, true);
  }
  accueil();
}
lancerAppli();

</script>
