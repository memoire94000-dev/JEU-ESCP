  --navy:#0a1236;--navy2:#101a4b;--panel:#172461;--panel2:#1e2d74;--line:#33438f;
  --fg:#f6f8ff;--dim:#bcc6ec;--violet:#a585ff;--cyan:#3fdcf7;--green:#46e3a8;--red:#ff7792;--amber:#ffca5c;
  --accent:var(--cyan);
  --font:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--navy);color:var(--fg);font:500 18px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
h1,h2,h3{font-weight:800;line-height:1.15;text-wrap:balance}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{width:100%;max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px;flex:1}
.wrap.narrow{max-width:560px}
.wrap.wide{max-width:1500px}


.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.logo{display:inline-flex;align-items:center;background:#fff;color:#0a1236;font-weight:800;font-size:20px;letter-spacing:-.02em;padding:6px 16px;border-radius:999px;line-height:1.2}
.logo b{color:#1f8fe0;font-weight:800}
.link{color:var(--dim);font-size:16px;font-weight:700;padding:10px 6px;background:none}
.link:hover{color:var(--fg)}


.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:12px 22px;border-radius:14px;font-weight:700;background:var(--panel2);border:2px solid var(--line);transition:transform .1s,background .15s;text-align:center}
.btn:hover{background:#28398a}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#07103a}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{min-height:64px;font-size:20px}
.btn:disabled{opacity:.5;cursor:default}
.field{width:100%;min-height:56px;border-radius:14px;background:var(--navy2);border:2px solid var(--line);padding:10px 16px;font-size:20px;font-weight:700}
.field:focus{border-color:var(--cyan);outline:none}
.field::placeholder{color:#8794c6;font-weight:500}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 150px}
.muted{color:var(--dim)}
.small{font-size:15px}
.err{color:var(--red);font-weight:700}


.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
.hero h1{font-size:clamp(40px,7vw,72px);letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--cyan)}
.hero p{font-size:19px;color:var(--dim);margin-top:10px;max-width:34em}
.join{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.join h2{font-size:22px}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.game{--accent:var(--c);text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s}
.game:hover{border-color:var(--c);transform:translateY(-2px)}
.game h3{font-size:23px;color:var(--c)}
.game p{color:var(--dim);font-size:16px}
.section-h{font-size:24px}
.homeqr{max-width:300px;justify-self:end}
.homeqr svg{max-width:240px}
.bests{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.bests span{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--navy2);color:var(--dim)}
.bests b{color:var(--c);font-variant-numeric:tabular-nums}
.foot{margin-top:auto;padding-top:24px;color:#93a0d3;font-size:14px;text-align:center}
.foot button{color:#93a0d3;text-decoration:underline;font-size:14px;padding:6px}


.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.level{min-height:72px;border-radius:14px;background:var(--panel);border:2px solid var(--line);font-weight:800;font-size:21px;padding:10px;transition:background .15s,border-color .15s,color .15s}
.level small{display:block;font-weight:500;font-size:14px;color:var(--dim)}
.level:hover{border-color:var(--accent)}
.level.on{background:var(--accent);border-color:var(--accent);color:#07103a}
.level.on small{color:#0c1a4f}


.host{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:24px;flex:1}
.qr-card{background:#fff;color:#0a1236;border-radius:20px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;align-self:start}
.qr-card svg{width:100%;max-width:360px;height:auto;display:block}
.qr-card .lbl{font-size:16px;font-weight:700}
.code{font-size:clamp(48px,6vw,76px);font-weight:800;letter-spacing:.08em;line-height:1;color:#0a1236}
.url{font-size:15px;word-break:break-all;color:#34406f}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:22px}
.pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pick button{--accent:var(--c);border:2px solid var(--line);border-radius:12px;padding:12px;font-weight:700;background:var(--navy2);min-height:66px;font-size:16px;line-height:1.2}
.pick button.on{background:var(--c);border-color:var(--c);color:#07103a}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-height:30vh;overflow:auto}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;font-weight:700;font-size:18px}
.chip button{width:26px;height:26px;border-radius:50%;background:var(--navy2);color:var(--dim);font-size:15px;line-height:1}
.empty{color:var(--dim);padding:6px 0}


.board{position:relative;width:100%}
.lrow{position:absolute;left:0;right:0;height:52px;display:grid;grid-template-columns:44px minmax(0,1fr) 150px;align-items:center;gap:10px;padding:0 14px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);transition:transform .45s cubic-bezier(.3,.8,.3,1)}
.lrow .bar{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.26;border-radius:10px;transition:width .4s}
.lrow>span{position:relative;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .rk{color:var(--accent);font-weight:800}
.lrow .val{text-align:right;font-variant-numeric:tabular-nums}
.lrow.done{border-color:var(--green)}
.big-time{font-size:clamp(40px,5vw,64px);font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1}
.live-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}


.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:12px}
.pod{border-radius:14px 14px 0 0;background:var(--panel2);text-align:center;padding:14px 8px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-width:0}
.pod .n{font-size:44px;font-weight:800;line-height:1}
.pod .p{font-size:21px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod.p1{height:210px;background:linear-gradient(180deg,#ffd35c,#d59a22);color:#2a1a00}
.pod.p2{height:170px;background:linear-gradient(180deg,#dfe7ff,#9eabd7);color:#141d4a}
.pod.p3{height:140px;background:linear-gradient(180deg,#f0ae7a,#bb7238);color:#2a1300}
table.rank{width:100%;border-collapse:collapse;font-size:17px}
table.rank td,table.rank th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
table.rank th{font-size:14px;color:var(--dim);font-weight:700}
table.rank td.r,table.rank th.r{text-align:right}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:9px 14px;border-radius:999px;font-size:15px;font-weight:700;border:2px solid var(--line);background:var(--navy2)}
.tabs button.on{background:var(--cyan);border-color:var(--cyan);color:#07103a}


.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:16px 0}
.count{font-size:120px;font-weight:800;line-height:1;color:var(--cyan)}
.hello{font-size:30px;font-weight:800}
.badge{display:inline-block;padding:4px 14px;border-radius:999px;background:var(--panel2);border:2px solid var(--line);font-weight:700;font-size:15px}
.resultN{font-size:64px;font-weight:800;line-height:1;color:var(--cyan)}


.g{--accent:var(--c,var(--cyan));flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:16px}
.hud b{color:var(--accent);font-size:21px;font-variant-numeric:tabular-nums}
.tbar{height:10px;background:var(--navy2);border-radius:6px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);width:100%}
.q{background:var(--panel);border:2px solid var(--accent);border-radius:var(--r);padding:20px;font-size:clamp(22px,4.5vw,32px);font-weight:700;line-height:1.25;text-align:center;min-height:120px;display:flex;align-items:center;justify-content:center;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{min-height:74px;border-radius:14px;background:var(--panel2);border:2px solid var(--line);padding:10px;font-weight:700;font-size:clamp(17px,3.8vw,23px);line-height:1.2}
.opt:hover{border-color:var(--accent)}
.opt.ok{background:var(--green);border-color:var(--green);color:#06242a}
.opt.bad{background:var(--red);border-color:var(--red);color:#2a0612}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}


.stage{flex:1;min-height:300px;width:100%;border-radius:20px;border:3px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:clamp(34px,8vw,64px);font-weight:800;padding:16px;text-align:center;transition:background .1s,border-color .1s;line-height:1.1;overflow-wrap:anywhere}
.stage.hit{background:#1b6f58;border-color:var(--green)}
.stage.bad{background:#7a2340;border-color:var(--red)}
.cat{color:var(--accent);font-size:clamp(26px,6vw,44px);font-weight:800}


.sn{flex:1;display:flex;flex-direction:column;gap:8px;align-items:center;min-height:0}
.prompt{width:100%;background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:10px 14px;text-align:center;font-weight:700;font-size:17px;line-height:1.3;min-height:66px;display:flex;align-items:center;justify-content:center}
.blanks{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:34px}
.blanks span{min-width:42px;height:34px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;border-bottom:3px solid var(--accent);font-weight:800;font-size:17px}
.blanks span.f{color:var(--accent);border-color:var(--green)}
canvas#snake{display:block;touch-action:none;border-radius:12px;border:2px solid var(--line)}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,58px);gap:6px;justify-content:center}
.pad button{background:var(--panel2);border:2px solid var(--line);border-radius:12px;font-size:24px;font-weight:800;touch-action:none}
.pad button:active{background:var(--accent);color:#07103a}
.pad .u{grid-column:2}
.pad .l{grid-column:1;grid-row:2}
.pad .d{grid-column:2;grid-row:2}
.pad .r{grid-column:3;grid-row:2}


.door{background:var(--panel);border:2px solid var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.slots{display:flex;gap:6px}
.slots span{width:40px;height:46px;border-radius:8px;background:var(--navy2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:var(--green)}
.casiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.casier{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:700;font-size:14px;line-height:1.2;min-height:128px;justify-content:center}
.casier svg{width:36px;height:36px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.casier.solved{border-color:var(--green);background:#143a54}
.casier.solved svg{stroke:var(--green)}
.puzzle{display:flex;flex-direction:column;gap:12px;flex:1}
.puzzle h3{font-size:21px;color:var(--accent)}
.mem{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:8px}
.card{min-height:74px;border-radius:10px;background:var(--panel2);border:2px solid var(--line);padding:6px;font-weight:700;font-size:15px;line-height:1.15;overflow-wrap:anywhere}
.card.up{background:#fff;color:#0a1236;border-color:#fff}
.card.done{background:var(--green);border-color:var(--green);color:#06242a}
.mirror{transform:scaleX(-1);display:inline-block}
.flip{transform:scale(-1,-1);display:inline-block}
.letters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.letter{width:46px;height:50px;border-radius:9px;background:var(--panel2);border:2px solid var(--line);font-weight:800;font-size:22px}
.letter:disabled{opacity:.25}
.answer{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:50px}
.answer span{min-width:30px;height:44px;border-bottom:3px solid var(--accent);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:23px}
.answer span.sp{border:0;min-width:14px}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:330px;width:100%;margin:0 auto}
.keypad button{min-height:58px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);font-weight:800;font-size:24px}
.keypad .ok{background:var(--green);border-color:var(--green);color:#06242a}
.display{background:#04102e;border:2px solid var(--green);border-radius:12px;padding:12px 16px;text-align:right;font-size:30px;font-weight:800;color:var(--green);min-height:62px;max-width:330px;width:100%;margin:0 auto;font-variant-numeric:tabular-nums}
.seq{display:flex;flex-direction:column;gap:8px}
.step{min-height:54px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);padding:10px 14px;font-weight:700;font-size:17px;text-align:left}
.step.done{background:#143a54;border-color:var(--green)}
.hint{color:var(--amber);font-size:16px;font-weight:700}
.note{background:var(--navy2);border:2px solid var(--green);border-radius:12px;padding:12px;font-size:16px;text-align:center}
.flash{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--green);color:#06242a;padding:9px 20px;border-radius:999px;font-weight:800;z-index:40;max-width:92vw;text-align:center}
.flash.bad{background:var(--red);color:#2a0612}
.prose{font-size:17px;color:var(--dim);display:flex;flex-direction:column;gap:10px}
.prose b{color:var(--fg)}

@media (max-width:820px){
  body{font-size:17px}
  .hero{grid-template-columns:1fr;gap:18px}
  .games{grid-template-columns:1fr}
  .homeqr{display:none}
  .host{grid-template-columns:1fr}
  .pick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .casier{min-height:112px;font-size:13px}
}
@media (max-width:380px){
  .casiers{grid-template-columns:repeat(2,minmax(0,1fr))}
  .slots span{width:36px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;

      return pattern;

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);

        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];

          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;

        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }

        var b2 = read();

      var bytes = [];

        if (c < 128) {

<script>
/* Les quatre jeux. Chaque jeu reçoit un niveau, une graine (même partie pour tous en direct)
   et signale son score par cb.report(score, label) puis cb.end(résultat). */
window.Games = (function () {
  const D = window.ARENA_DATA;
  const LEVELS = ["Facile", "Moyen", "Difficile", "Pro"];
  const INFO = {
    dates: { name: "La course aux dates", c: "#ffca5c", desc: "QCM de vitesse. Enchaîne les bonnes réponses : à la première erreur, la série s'arrête." },
    escape: { name: "L'évasion des PCS", c: "#a585ff", desc: "Six casiers, six énigmes sur les catégories socioprofessionnelles, une porte à ouvrir." },
    snake: { name: "Le serpent des figures", c: "#46e3a8", desc: "Dirige le serpent et mange les bonnes syllabes pour écrire la figure de style." },
    clic: { name: "Clic ou pas", c: "#3fdcf7", desc: "Les noms défilent : clique seulement sur ceux qui entrent dans la catégorie." },
  };

  const fr = (s) => String(s).replace(/ ([:;!?»])/g, "\u00a0$1").replace(/« /g, "«\u00a0");
  const esc = (s) => fr(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(list, r) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  const yearLabel = (y) => (y < 0 ? `${-y} av. J.-C.` : String(y));

  /* Sons courts, activés par l'interaction */
  const Sfx = (function () {
    let ctx = null;
    let muted = false;
    try { muted = localStorage.getItem("arena:mute") === "1"; } catch (e) { /* stockage indisponible */ }
    function beep(f, d, type) {
      if (muted) return;
      try {
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = type || "sine";
        o.frequency.value = f;
        g.gain.setValueAtTime(0.14, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d);
        o.connect(g).connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + d);
      } catch (e) { /* audio indisponible */ }
    }
    return {
      ok() { beep(740, 0.1); },
      ko() { beep(160, 0.25, "square"); },
      win() { [523, 659, 784].forEach((f, i) => setTimeout(() => beep(f, 0.18), i * 110)); },
      get muted() { return muted; },
      toggle() { muted = !muted; try { localStorage.setItem("arena:mute", muted ? "1" : "0"); } catch (e) { /* stockage indisponible */ } return muted; },
    };
  })();

  /* Outils communs : minuteries annulées à l'arrêt */
  function kit() {
    const timers = new Set();
    const off = [];
    let raf = 0;
    const g = {
      stopped: false,
      t(fn, ms) { const id = setTimeout(() => { timers.delete(id); if (!g.stopped) fn(); }, ms); timers.add(id); return id; },
      clear(id) { clearTimeout(id); timers.delete(id); },
      frame(fn) { cancelAnimationFrame(raf); const loop = (ts) => { if (g.stopped) return; if (fn(ts) !== false) raf = requestAnimationFrame(loop); }; raf = requestAnimationFrame(loop); },
      on(el, ev, fn, opt) { el.addEventListener(ev, fn, opt); off.push(() => el.removeEventListener(ev, fn, opt)); },
      stop() { g.stopped = true; timers.forEach(clearTimeout); timers.clear(); cancelAnimationFrame(raf); off.forEach((f) => f()); off.length = 0; },
    };
    return g;
  }

  function flash(root, text, bad) {
    const n = document.createElement("div");
    n.className = "flash" + (bad ? " bad" : "");
    n.textContent = fr(text);
    root.appendChild(n);
    setTimeout(() => n.remove(), 1500);
  }

  /* ---------- 1. La course aux dates ---------- */
  function dates(level, seed, m, cb, g) {
    const r = rng(seed ^ 0x9e37);
    const pool = D.dates[level];
    const list = shuffle(pool, r).slice(0, Math.min(30, pool.length));
    const qt = [12000, 8000, 6000, 4000][level];
    let i = 0, streak = 0, score = 0;

    function options(y) {
      const [lo, hi] = [[15, 120], [3, 30], [2, 12], [1, 6]][level];
      const set = new Set([y]);
      let guard = 0;
      while (set.size < 4 && guard++ < 300) {
        const d = lo + Math.floor(r() * (hi - lo + 1));
        const v = y + (r() < 0.5 ? -d : d);
        if (v === 0 || (y > 0 && v <= 0) || v > 2026 || set.has(v)) continue;
        set.add(v);
      }
      return shuffle([...set], r);
    }

    function question() {
      if (i >= list.length) return finish(true);
      const [y, ev] = list[i];
      const eventForm = r() < 0.25;
      const opts = eventForm
        ? shuffle([ev, ...shuffle(pool.filter((p) => p[0] !== y), r).slice(0, 3).map((p) => p[1])], r)
        : options(y).map(yearLabel);
      const good = eventForm ? ev : yearLabel(y);
      m.innerHTML = `<div class="hud"><span>Série <b>${streak}</b></span><span>Question <b>${i + 1}</b> / ${list.length}</span></div>
        <div class="tbar"><i id="tb"></i></div>
        <div class="q">${eventForm ? `Que s'est-il passé en ${esc(yearLabel(y))} ?` : `En quelle année ?<br>${esc(ev)}`}</div>
        <div class="opts">${opts.map((o, n) => `<button class="opt" data-n="${n}">${esc(o)}</button>`).join("")}</div>`;
      const tb = m.querySelector("#tb");
      const start = performance.now();
      let locked = false;
      const answer = (btn, val) => {
        if (locked) return;
        locked = true;
        const ms = performance.now() - start;
        if (val === good) {
          btn.classList.add("ok");
          Sfx.ok();
          streak++;
          score += 100 + Math.round(50 * Math.max(0, 1 - ms / qt));
          cb.report(score, `${streak} sans faute`);
          i++;
          g.t(question, 280);
        } else {
          if (btn) btn.classList.add("bad");
          m.querySelectorAll(".opt").forEach((b, n) => { if (opts[n] === good) b.classList.add("ok"); });
          Sfx.ko();
          g.t(() => finish(false), 1900);
        }
      };
      m.querySelectorAll(".opt").forEach((b) => g.on(b, "click", () => answer(b, opts[+b.dataset.n])));
      g.frame((ts) => {
        if (locked) return false;
        const f = Math.max(0, 1 - (ts - start) / qt);
        tb.style.width = f * 100 + "%";
        if (f <= 0) { answer(null, null); return false; }
      });
    }

    function finish(all) {
      const label = `${streak} sans faute`;
      cb.report(score, label, true);
      cb.end({ score, label, big: String(streak), unit: streak > 1 ? "bonnes réponses d'affilée" : "bonne réponse d'affilée", note: all ? "Série parfaite : tu as vidé le paquet." : "Une erreur et la série s'arrête." });
    }
    question();
  }

  /* ---------- 2. Clic ou pas ---------- */
  function clic(level, seed, m, cb, g) {
    const r = rng(seed ^ 0x1234);
    const cfg = [{ cats: 3, items: 12, t: 1800 }, { cats: 3, items: 14, t: 1400 }, { cats: 4, items: 14, t: 1000 }, { cats: 4, items: 16, t: 750 }][level];
    const cats = shuffle(D.clic[level], r).slice(0, cfg.cats);
    const total = cfg.cats * cfg.items;
    let ci = 0, seen = 0, good = 0, score = 0, hits = 0, sumRt = 0, misses = 0, falses = 0;
    const label = () => `${seen ? Math.round((good / seen) * 100) : 0} % · ${hits ? Math.round(sumRt / hits) : "–"} ms`;

    function nextCat() {
      if (ci >= cats.length) return finish();
      const c = cats[ci];
      const nYes = Math.max(2, Math.round(cfg.items * 0.42));
      const yes = shuffle(c.y, r).slice(0, Math.min(nYes, c.y.length));
      const no = shuffle(c.n, r).slice(0, cfg.items - yes.length);
      const items = shuffle([...yes.map((t) => ({ t, y: true })), ...no.map((t) => ({ t, y: false }))], r);
      m.innerHTML = `<div class="hud"><span>Catégorie <b>${ci + 1}</b> / ${cats.length}</span><span>${esc(label())}</span></div>
        <div class="stage" id="st"><div><div class="muted small">Clique seulement sur</div><div class="cat">${esc(c.k)}</div></div></div>`;
      ci++;
      g.t(() => run(items, c, 0), 2600);
    }

    function run(items, c, idx) {
      if (idx >= items.length) return nextCat();
      const it = items[idx];
      const st = m.querySelector("#st");
      const hud = m.querySelector(".hud");
      hud.innerHTML = `<span class="small">Clique si : <b style="font-size:16px">${esc(c.k)}</b></span><span class="small">${idx + 1}/${items.length}</span>`;
      st.className = "stage";
      st.textContent = fr(it.t);
      let tapped = false;
      const t0 = performance.now();
      const tap = () => {
        if (tapped) return;
        tapped = true;
        if (it.y) {
          const rt = performance.now() - t0;
          hits++; good++; sumRt += rt;
          score += 100 + Math.round(60 * Math.max(0, 1 - rt / cfg.t));
          st.classList.add("hit");
          Sfx.ok();
        } else {
          falses++;
          st.classList.add("bad");
          Sfx.ko();
        }
      };
      const key = (e) => { if (e.code === "Space") { e.preventDefault(); tap(); } };
      g.on(st, "pointerdown", tap);
      g.on(window, "keydown", key);
      g.t(() => {
        st.removeEventListener("pointerdown", tap);
        window.removeEventListener("keydown", key);
        if (!it.y && !tapped) { good++; score += 100; }
        if (it.y && !tapped) { misses++; st.classList.add("bad"); }
        seen++;
        cb.report(score, label());
        st.textContent = "";
        g.t(() => { st.className = "stage"; run(items, c, idx + 1); }, 180);
      }, cfg.t);
    }

    function finish() {
      const pct = Math.round((good / total) * 100);
      const ms = hits ? Math.round(sumRt / hits) : 0;
      const lab = `${pct} % · ${ms || "–"} ms`;
      cb.report(score, lab, true);
      cb.end({ score, label: lab, big: `${pct} %`, unit: "de bonnes réponses", note: `Vitesse moyenne : ${ms ? ms + " ms" : "–"}. ${hits} trouvés, ${misses} oubliés, ${falses} clics en trop.` });
    }
    nextCat();
  }

  /* ---------- 3. Le serpent des figures ---------- */
  function snake(level, seed, m, cb, g) {
    const r = rng(seed ^ 0x77a1);
    const N = 13;
    const speed = [240, 200, 165, 135][level];
    const nDecoys = [2, 3, 5, 7][level];
    const wrap = level < 2;
    const limit = 150;
    const pool = D.figures.filter((f) => (level === 0 ? f.l === 0 : level === 1 ? f.l <= 1 : level === 2 ? f.l === 1 || f.l === 2 : f.l >= 2));
    const figs = shuffle(pool, r).slice(0, 8);
    const allSyl = [...new Set(D.figures.flatMap((f) => f.s))];
    const blocks = new Set();
    if (level === 3) {
      while (blocks.size < 8) {
        const x = 1 + Math.floor(r() * (N - 2)), y = 1 + Math.floor(r() * (N - 2));
        if (Math.abs(x - 6) > 2 || Math.abs(y - 6) > 1) blocks.add(`${x},${y}`);
      }
    }
    let figIdx = 0, sylIdx = 0, lives = 3, score = 0, foundN = 0;
    let body, dir, nextDir, tokens = [], grow = 0, frozen = 0, shake = 0;
    const t0 = performance.now();
    const fig = () => figs[figIdx];
    const ex = () => fig().e[Math.floor(figIdx * 7 + seed) % fig().e.length];
    const promptText = () => (level < 2 ? fig().d : ex());
    const label = () => `${foundN} figure${foundN > 1 ? "s" : ""}`;

    m.innerHTML = `<div class="sn">
      <div class="hud" style="width:100%"><span id="lv"></span><span>Figure <b id="fi"></b></span><span id="tm"></span></div>
      <div class="prompt" id="pr"></div>
      <div class="blanks" id="bl"></div>
      <canvas id="snake"></canvas>
      <div class="pad">
        <button class="u" data-d="0,-1" aria-label="Haut">↑</button>
        <button class="l" data-d="-1,0" aria-label="Gauche">←</button>
        <button class="d" data-d="0,1" aria-label="Bas">↓</button>
        <button class="r" data-d="1,0" aria-label="Droite">→</button>
      </div></div>`;
    const cv = m.querySelector("#snake");
    const ctx = cv.getContext("2d");
    let cell = 26;

    function size() {
      const avail = Math.min(m.clientWidth, Math.max(260, window.innerHeight - 340));
      const side = Math.min(avail, 620);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      cell = Math.floor(side / N);
      const px = cell * N;
      cv.style.width = cv.style.height = px + "px";
      cv.width = cv.height = Math.round(px * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    size();
    g.on(window, "resize", size);

    function updateText() {
      m.querySelector("#lv").textContent = "♥".repeat(lives) + "♡".repeat(3 - lives);
      m.querySelector("#fi").textContent = `${Math.min(figIdx + 1, figs.length)}/${figs.length}`;
      m.querySelector("#pr").textContent = fr(promptText());
      const s = fig().s;
      const hideLen = level === 3;
      let html = "";
      if (hideLen) {
        html = s.slice(0, sylIdx).map((x) => `<span class="f">${esc(x)}</span>`).join("") + `<span>?</span>`;
      } else {
        html = s.map((x, i) => {
          if (i < sylIdx) return `<span class="f">${esc(x)}</span>`;
          if (i === 0 && level === 0) return `<span>${esc(x[0])}…</span>`;
          return `<span></span>`;
        }).join("");
      }
      m.querySelector("#bl").innerHTML = html;
    }

    const occupied = (x, y) => body.some((b) => b.x === x && b.y === y) || blocks.has(`${x},${y}`);
    function freeCell(used) {
      for (let t = 0; t < 500; t++) {
        const x = Math.floor(r() * N), y = Math.floor(r() * N);
        const h = body[0];
        const k = `${x},${y}`;
        if (occupied(x, y) || used.has(k)) continue;
        if (Math.abs(x - h.x) + Math.abs(y - h.y) < 3) continue;
        used.add(k);
        return { x, y };
      }
      return { x: 0, y: 0 };
    }
    function spawnTokens() {
      const need = fig().s[sylIdx];
      const used = new Set();
      tokens = [{ ...freeCell(used), s: need, ok: true }];
      const decoys = shuffle(allSyl.filter((s) => s !== need), r).slice(0, nDecoys);
      decoys.forEach((s) => tokens.push({ ...freeCell(used), s, ok: false }));
    }
    function reset() {
      body = [{ x: 6, y: 6 }, { x: 5, y: 6 }, { x: 4, y: 6 }, { x: 3, y: 6 }];
      dir = { x: 1, y: 0 };
      nextDir = dir;
      grow = 0;
      frozen = 500;
      spawnTokens();
      updateText();
    }
    function hurt(msg) {
      lives--;
      shake = 8;
      Sfx.ko();
      flash(m, msg, true);
      updateText();
      if (lives <= 0) { finish(false); return true; }
      return false;
    }
    function eat(tok) {
      if (tok.ok) {
        grow++;
        Sfx.ok();
        score += 10 * (level + 1);
        sylIdx++;
        if (sylIdx >= fig().s.length) {
          foundN++;
          score += 50 * (level + 1);
          flash(m, `${fig().n} : bravo !`);
          cb.report(score, label());
          figIdx++;
          sylIdx = 0;
          if (figIdx >= figs.length) { finish(true); return; }
        } else {
          cb.report(score, label());
        }
        spawnTokens();
        updateText();
      } else {
        if (hurt("Mauvaise syllabe")) return;
        if (body.length > 3) body.pop();
        tokens = tokens.filter((t) => t !== tok);
        const used = new Set(tokens.map((t) => `${t.x},${t.y}`));
        tokens.push({ ...freeCell(used), s: tok.s, ok: false });
      }
    }
    function tick() {
      dir = nextDir;
      const h = { x: body[0].x + dir.x, y: body[0].y + dir.y };
      if (wrap) { h.x = (h.x + N) % N; h.y = (h.y + N) % N; }
      if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N) { if (!hurt("Le mur !")) reset(); return; }
      if (blocks.has(`${h.x},${h.y}`) || body.slice(0, -1).some((b) => b.x === h.x && b.y === h.y)) { if (!hurt("Collision !")) reset(); return; }
      body.unshift(h);
      if (grow > 0) grow--; else body.pop();
      const tok = tokens.find((t) => t.x === h.x && t.y === h.y);
      if (tok) eat(tok);
    }
    function draw() {
      const W = cell * N;
      ctx.save();
      if (shake > 0) { ctx.translate((shake % 2 ? -1 : 1) * 4, 0); shake--; }
      ctx.fillStyle = "#0d1742";
      ctx.fillRect(0, 0, W, W);
      ctx.strokeStyle = "rgba(120,140,220,.12)";
      ctx.lineWidth = 1;
      for (let i = 1; i < N; i++) {
        ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, W); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(W, i * cell); ctx.stroke();
      }
      if (!wrap) { ctx.strokeStyle = "#ff7792"; ctx.lineWidth = 3; ctx.strokeRect(1.5, 1.5, W - 3, W - 3); }
      ctx.fillStyle = "#33438f";
      blocks.forEach((k) => { const [x, y] = k.split(",").map(Number); ctx.fillRect(x * cell + 2, y * cell + 2, cell - 4, cell - 4); });
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      tokens.forEach((t) => {
        ctx.fillStyle = "#f6f8ff";
        const pad = 1;
        const x = t.x * cell + pad, y = t.y * cell + pad, s = cell - pad * 2;
        ctx.beginPath();
        ctx.roundRect(x, y, s, s, 7);
        ctx.fill();
        ctx.fillStyle = "#0a1236";
        let fs = Math.floor(cell * 0.46);
        ctx.font = `800 ${fs}px Poppins, sans-serif`;
        while (ctx.measureText(t.s).width > s - 3 && fs > 8) { fs--; ctx.font = `800 ${fs}px Poppins, sans-serif`; }
        ctx.fillText(t.s, t.x * cell + cell / 2, t.y * cell + cell / 2 + 1);
      });
      body.forEach((b, i) => {
        ctx.fillStyle = i === 0 ? "#46e3a8" : `hsl(${168 + i * 4},75%,${58 - Math.min(i, 12)}%)`;
        ctx.beginPath();
        ctx.roundRect(b.x * cell + 1.5, b.y * cell + 1.5, cell - 3, cell - 3, 7);
        ctx.fill();
      });
      const head = body[0];
      ctx.fillStyle = "#0a1236";
      ctx.beginPath();
      ctx.arc(head.x * cell + cell / 2 + dir.x * cell * 0.18, head.y * cell + cell / 2 + dir.y * cell * 0.18, cell * 0.1, 0, 7);
      ctx.fill();
      ctx.restore();
    }
    const setDir = (x, y) => {
      if (x === -dir.x && y === -dir.y) return;
      nextDir = { x, y };
    };
    m.querySelectorAll(".pad button").forEach((b) => {
      const [x, y] = b.dataset.d.split(",").map(Number);
      g.on(b, "pointerdown", (e) => { e.preventDefault(); setDir(x, y); });
    });
    g.on(window, "keydown", (e) => {
      const map = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], z: [0, -1], s: [0, 1], q: [-1, 0], d: [1, 0] };
      const d = map[e.key];
      if (d) { e.preventDefault(); setDir(d[0], d[1]); }
    });
    let sx = 0, sy = 0, swiping = false;
    g.on(cv, "pointerdown", (e) => { swiping = true; sx = e.clientX; sy = e.clientY; cv.setPointerCapture(e.pointerId); });
    g.on(cv, "pointermove", (e) => {
      if (!swiping) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0); else setDir(0, dy > 0 ? 1 : -1);
      sx = e.clientX; sy = e.clientY;
    });
    g.on(cv, "pointerup", () => { swiping = false; });

    let ended = false;
    function finish(all) {
      if (ended) return;
      ended = true;
      if (all) { score += lives * 30 * (level + 1); Sfx.win(); }
      const lab = label();
      cb.report(score, lab, true);
      cb.end({ score, label: lab, big: String(foundN), unit: foundN > 1 ? "figures trouvées" : "figure trouvée", note: all ? "Toutes les figures sont trouvées." : "Regarde bien l'indice avant de foncer." });
    }

    reset();
    let last = performance.now(), acc = 0;
    g.frame((ts) => {
      if (ended) return false;
      const dt = ts - last;
      last = ts;
      if (frozen > 0) frozen -= dt;
      else {
        acc += dt;
        const step = Math.max(90, speed - figIdx * 4);
        while (acc >= step && !ended) { acc -= step; tick(); }
      }
      const left = limit - (ts - t0) / 1000;
      m.querySelector("#tm").textContent = fmt(Math.max(0, left));
      if (left <= 0) { finish(false); return false; }
      draw();
    });
  }

  /* ---------- 4. L'évasion des PCS ---------- */
  const ICONS = [
    '<path d="M12 21V7m0 0c-1-3 0-5 0-5s3 1 3 5m-3 0c1-3 0-5 0-5s-3 1-3 5m3 8c-3 0-5-2-5-4m5 7c3 0 5-2 5-4"/>',
    '<path d="M3 10h18l-2-6H5zM5 10v10h14V10M9 20v-6h6v6"/>',
    '<path d="M4 8h16v12H4zM9 8V5h6v3M4 13h16"/>',
    '<circle cx="12" cy="12" r="3"/><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/>',
    '<path d="M4 20h16l-1-9H5zM7 11V4h10v7M9 15h6"/>',
    '<path d="M4 20l6-6m0 0 3-8 5 5-8 3zM14 4l6 6"/>',
  ];
  const norm = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();

  function escape(level, seed, m, cb, g) {
    const r = rng(seed ^ 0xbeef);
    const set = D.escape[level];
    const limit = [480, 600, 720, 900][level];
    const solved = [false, false, false, false, false, false];
    const letters = set.scr.split("");
    let penalty = 0, errors = 0;
    const t0 = performance.now();
    const elapsed = () => (performance.now() - t0) / 1000 + penalty;
    const nSolved = () => solved.filter(Boolean).length;
    const label = () => `${nSolved()}/6 énigmes`;
    const scoreNow = () => nSolved() * 500;
    const wrong = () => { penalty += 10; errors++; Sfx.ko(); flash(m, "+10 s de pénalité", true); };
    let finished = false;

    function clock() {
      g.frame(() => {
        const e = m.querySelector("#clk");
        if (!e) return false;
        e.textContent = fmt(elapsed());
      });
    }

    function room() {
      m.innerHTML = `<div class="hud"><span>Chrono <b id="clk">0:00</b></span><span><b>${nSolved()}</b> / 6 casiers</span></div>
      <div class="door"><div class="small muted">Tu es enfermé dans la salle des recensements. Chaque casier ouvert donne une lettre de la porte.</div>
      <div class="slots">${letters.map((l, i) => `<span>${solved[i] ? l : ""}</span>`).join("")}</div>
      ${nSolved() === 6 ? `<button class="btn primary big" id="final">Ouvrir la porte</button>` : ""}</div>
      <div class="casiers">${D.pcs.map((p, i) => `<button class="casier ${solved[i] ? "solved" : ""}" data-i="${i}"><svg viewBox="0 0 24 24">${ICONS[i]}</svg>${esc(p.k)}${solved[i] ? `<span style="color:var(--green);font-size:18px;font-weight:800">${esc(letters[i])}</span>` : ""}</button>`).join("")}</div>`;
      m.querySelectorAll(".casier").forEach((b) => g.on(b, "click", () => { const k = +b.dataset.i; if (!solved[k]) open(k); }));
      const f = m.querySelector("#final");
      if (f) g.on(f, "click", finalDoor);
      clock();
    }

    function shell(k, instr) {
      const key = ["memory", "riddle", "mirror", "anagram", "caisse", "sequence"][k];
      const data = set[key];
      m.innerHTML = `<div class="puzzle"><div class="hud"><button class="link" id="back">← Retour</button><span>Chrono <b id="clk">0:00</b></span></div>
      <h3>${esc(D.pcs[k].k)}</h3><div class="muted small">${esc(instr)}</div>
      <div id="body" style="display:flex;flex-direction:column;gap:12px"></div>
      <button class="link" id="hint" style="text-align:left">Besoin d'un indice ? (+30 s)</button><div class="hint" id="ht" hidden></div></div>`;
      g.on(m.querySelector("#back"), "click", room);
      const hb = m.querySelector("#hint");
      g.on(hb, "click", () => {
        penalty += 30;
        hb.hidden = true;
        const ht = m.querySelector("#ht");
        ht.textContent = fr(data.hint);
        ht.hidden = false;
      });
      clock();
      return m.querySelector("#body");
    }

    function win(k) {
      solved[k] = true;
      Sfx.win();
      cb.report(scoreNow(), label());
      m.innerHTML = `<div class="center"><div class="badge">Casier ouvert</div><div class="resultN">${esc(letters[k])}</div>
        <div class="note">${esc(D.pcs[k].c)}</div><button class="btn primary big" id="go">Retour à la pièce</button></div>`;
      g.on(m.querySelector("#go"), "click", room);
    }

    const open = (k) => [memory, riddle, mirror, anagram, caisse, sequence][k](k);

    function memory(k) {
      const body = shell(k, "Retrouve les paires : retourne deux cartes à la fois.");
      const pairs = set.memory.pairs;
      const cards = shuffle(pairs.flatMap((p, i) => [{ t: p[0], id: i }, { t: p[1], id: i }]), r);
      const cols = cards.length <= 12 ? 3 : 4;
      body.innerHTML = `<div class="mem" style="--cols:${cols}">${cards.map((c, i) => `<button class="card" data-i="${i}">?</button>`).join("")}</div>`;
      const els = [...body.querySelectorAll(".card")];
      let first = -1, busy = false, left = pairs.length;
      els.forEach((b, i) => g.on(b, "click", () => {
        if (busy || b.classList.contains("up") || b.classList.contains("done")) return;
        b.classList.add("up");
        b.textContent = fr(cards[i].t);
        if (first < 0) { first = i; return; }
        const a = first;
        first = -1;
        if (cards[a].id === cards[i].id) {
          Sfx.ok();
          els[a].classList.remove("up"); els[a].classList.add("done");
          b.classList.remove("up"); b.classList.add("done");
          left--;
          if (!left) g.t(() => win(k), 500);
        } else {
          busy = true;
          g.t(() => { [els[a], b].forEach((x) => { x.classList.remove("up"); x.textContent = "?"; }); busy = false; }, 900);
        }
      }));
    }

    function quiz(k, instr, items, style) {
      const body = shell(k, instr);
      let i = 0;
      const show = () => {
        const it = items[i];
        const opts = shuffle([it.a, ...it.o], r);
        const reversed = style === "reverse" ? it.t.split("").reverse().join("") : it.t;
        const cls = style === "mirror" ? "mirror" : style === "flip" ? "flip" : "";
        body.innerHTML = `<div class="q"><span class="${cls}">${esc(reversed)}</span></div>
        <div class="hud"><span class="small muted">${i + 1} / ${items.length}</span></div>
        <div class="opts">${opts.map((o, n) => `<button class="opt" data-n="${n}">${esc(o)}</button>`).join("")}</div>`;
        body.querySelectorAll(".opt").forEach((b) => g.on(b, "click", () => {
          if (opts[+b.dataset.n] === it.a) {
            Sfx.ok();
            i++;
            if (i >= items.length) win(k); else show();
          } else {
            wrong();
            b.classList.add("bad", "shake");
            b.disabled = true;
          }
        }));
      };
      show();
    }
    const riddle = (k) => quiz(k, "Qui suis-je ? Choisis la bonne réponse.", set.riddle.items);
    const mirror = (k) => {
      const st = set.mirror.style;
      const instr = st === "mirror" ? "Le message est écrit en miroir. Quel métier y est caché ?" : st === "reverse" ? "Le message est écrit à l'envers. Quel métier y est caché ?" : "Le message est retourné. Quel métier y est caché ?";
      quiz(k, instr, set.mirror.items, st);
    };

    function anagram(k) {
      const body = shell(k, "Remets les lettres dans l'ordre.");
      let i = 0;
      const show = () => {
        const [word, hint] = set.anagram.items[i];
        const chars = word.split("");
        const pool = shuffle(chars.map((c, n) => ({ c, n })).filter((x) => x.c !== " "), r);
        let picked = [];
        const render = () => {
          let p = 0;
          const shown = chars.map((c) => {
            if (c === " ") return `<span class="sp"></span>`;
            const v = picked[p++];
            return `<span>${v ? v.c : ""}</span>`;
          }).join("");
          body.innerHTML = `<div class="q" style="font-size:19px;min-height:80px">${esc(hint)}</div>
          <div class="answer">${shown}</div>
          <div class="letters">${pool.map((x, n) => `<button class="letter" data-n="${n}" ${picked.includes(x) ? "disabled" : ""}>${x.c}</button>`).join("")}</div>
          <button class="link" id="clear">Tout effacer</button>`;
          body.querySelectorAll(".letter").forEach((b) => g.on(b, "click", () => {
            picked.push(pool[+b.dataset.n]);
            const needed = chars.filter((c) => c !== " ").length;
            if (picked.length === needed) {
              const typed = picked.map((x) => x.c).join("");
              if (typed === word.replace(/ /g, "")) {
                Sfx.ok();
                i++;
                if (i >= set.anagram.items.length) return win(k);
                return show();
              }
              wrong();
              picked = [];
            }
            render();
          }));
          g.on(body.querySelector("#clear"), "click", () => { picked = []; render(); });
        };
        render();
      };
      show();
    }

    function caisse(k) {
      const body = shell(k, "À la caisse, calcule juste. Utilise le pavé numérique.");
      let i = 0, val = "";
      const show = () => {
        const it = set.caisse.items[i];
        body.innerHTML = `<div class="q" style="font-size:20px">${esc(it.q)}</div>
        <div class="display" id="d">${val || "0"}</div>
        <div class="keypad">${["7", "8", "9", "4", "5", "6", "1", "2", "3", ",", "0", "⌫"].map((x) => `<button data-k="${x}">${x}</button>`).join("")}
        <button class="ok" id="v" style="grid-column:1/-1">Valider</button></div>`;
        const d = body.querySelector("#d");
        body.querySelectorAll("[data-k]").forEach((b) => g.on(b, "click", () => {
          const x = b.dataset.k;
          if (x === "⌫") val = val.slice(0, -1);
          else if (x === "," ? !val.includes(",") && val : val.length < 8) val += x;
          d.textContent = val || "0";
        }));
        g.on(body.querySelector("#v"), "click", () => {
          const n = parseFloat(val.replace(",", "."));
          if (Math.abs(n - it.a) < 0.001) {
            Sfx.ok();
            val = "";
            i++;
            if (i >= set.caisse.items.length) win(k); else show();
          } else if (val) {
            wrong();
            val = "";
            d.textContent = "0";
            d.classList.add("shake");
          }
        });
      };
      show();
    }

    function sequence(k) {
      const body = shell(k, set.sequence.title);
      const steps = set.sequence.steps;
      const order = shuffle(steps, r);
      let n = 0;
      const render = () => {
        body.innerHTML = `<div class="seq">${order.map((s) => {
          const at = steps.indexOf(s);
          const done = at < n;
          return `<button class="step ${done ? "done" : ""}" data-s="${esc(s)}" ${done ? "disabled" : ""}>${done ? at + 1 + ". " : ""}${esc(s)}</button>`;
        }).join("")}</div><div class="muted small">Touche les étapes de la première à la dernière.</div>`;
        body.querySelectorAll(".step:not([disabled])").forEach((b) => g.on(b, "click", () => {
          const s = order.find((x) => esc(x) === b.dataset.s);
          if (steps.indexOf(s) === n) {
            Sfx.ok();
            n++;
            if (n >= steps.length) win(k); else render();
          } else {
            wrong();
            b.classList.add("shake");
          }
        }));
      };
      render();
    }

    function finalDoor() {
      m.innerHTML = `<div class="puzzle"><div class="hud"><button class="link" id="back">← Retour</button><span>Chrono <b id="clk">0:00</b></span></div>
      <h3>La porte</h3><div class="q" style="font-size:20px">${esc(set.clue)}</div><div id="f" style="display:flex;flex-direction:column;gap:12px"></div></div>`;
      g.on(m.querySelector("#back"), "click", room);
      clock();
      const body = m.querySelector("#f");
      let picked = [];
      const target = norm(set.word);
      const pool = shuffle(letters.map((c, n) => ({ c, n })), r);
      const render = () => {
        body.innerHTML = `<div class="answer">${letters.map((_, i) => `<span>${picked[i] ? picked[i].c : ""}</span>`).join("")}</div>
        <div class="letters">${pool.map((x, n) => `<button class="letter" data-n="${n}" ${picked.includes(x) ? "disabled" : ""}>${x.c}</button>`).join("")}</div>
        <button class="link" id="clear">Tout effacer</button>`;
        body.querySelectorAll(".letter").forEach((b) => g.on(b, "click", () => {
          picked.push(pool[+b.dataset.n]);
          if (picked.length === letters.length) {
            if (norm(picked.map((x) => x.c).join("")) === target) return escaped();
            wrong();
            picked = [];
          }
          render();
        }));
        g.on(body.querySelector("#clear"), "click", () => { picked = []; render(); });
      };
      render();
    }

    function escaped() {
      if (finished) return;
      finished = true;
      Sfx.win();
      const e = elapsed();
      const score = 3000 + 1000 + Math.round(Math.max(0, limit - e) * 2);
      const lab = `Évadé en ${fmt(e)}`;
      cb.report(score, lab, true);
      cb.end({ score, label: lab, big: fmt(e), unit: "pour t'évader", note: `Le mot de la porte : ${set.word}. ${errors} erreur${errors > 1 ? "s" : ""}.` });
    }
    room();
  }

  const IMPL = { dates, clic, snake, escape };

  function start(key, level, seed, mount, cb) {
    const g = kit();
    const info = INFO[key];
    mount.innerHTML = `<div class="g" style="--c:${info.c}"></div>`;
    const m = mount.firstChild;
    IMPL[key](level, seed >>> 0, m, cb, g);
    return { stop() { g.stop(); } };
  }

  return { start, LEVELS, INFO, esc, fr, Sfx, fmt };
})();

</script>
<script>
(function () {
  const SHARE_URL = /^https?:$/.test(location.protocol) ? location.href.split("#")[0] : "";
  const { start: startGame, LEVELS, INFO, esc, fr, Sfx } = window.Games;
  const app = document.getElementById("app");
  const KEYS = ["dates", "escape", "snake", "clic"];

  const fixTypo = (t) => t.replace(/'/g, "\u2019").replace(/ ([:;!?»])/g, "\u00a0$1").replace(/« /g, "«\u00a0");
  function typoNode(node) {
    if (node.nodeType === 3) { const n = fixTypo(node.nodeValue); if (n !== node.nodeValue) node.nodeValue = n; return; }
    if (node.nodeType !== 1 || node.tagName === "SCRIPT" || node.tagName === "STYLE") return;
    node.childNodes.forEach(typoNode);
  }
  new MutationObserver((list) => list.forEach((m) => { if (m.type === "characterData") typoNode(m.target); else m.addedNodes.forEach(typoNode); })).observe(app, { childList: true, subtree: true, characterData: true });

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* stockage indisponible */ } },
  };
  async function keepAwake() { try { await navigator.wakeLock?.request("screen"); } catch (e) { /* non pris en charge */ } }

  const logo = `<span class="logo">memor<b>all</b></span>`;
  const homeBtn = `<button class="link" id="home">Accueil</button>`;
  const footer = `<div class="foot">Memorall · <button id="legal">Mentions légales</button></div>`;
  function header(right) {
    return `<div class="top">${logo}<div style="display:flex;gap:6px;align-items:center">${right || ""}<button class="link" id="snd">${Sfx.muted ? "Son coupé" : "Son actif"}</button></div></div>`;
  }
  let game = null;
  function stopGame() { if (game) { game.stop(); game = null; } }
  function view(html) {
    app.innerHTML = html;
    window.scrollTo(0, 0);
    const s = document.getElementById("snd");
    if (s) s.onclick = () => { Sfx.toggle(); s.textContent = Sfx.muted ? "Son coupé" : "Son actif"; };
    const h = document.getElementById("home");
    if (h) h.onclick = () => { if (location.hash) location.hash = ""; home(); };
    const l = document.getElementById("legal");
    if (l) l.onclick = legal;
  }

  function drawQR(text) {
    if (typeof qrcode === "undefined" || !text) return `<div class="url">${esc(text || "")}</div>`;
    const q = qrcode(0, "M");
    q.addData(text);
    q.make();
    const n = q.getModuleCount();
    let d = "";
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) d += `M${x} ${y}h1v1h-1z`;
    return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" role="img" aria-label="QR code pour ouvrir le jeu" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${d}" fill="#0a1236"/></svg>`;
  }

  function home() {
    stopGame();
    const bests = (k) => LEVELS.map((l, i) => {
      const top = readRecords(k, i)[0];
      return `<span>${l} <b>${top ? top.s : "–"}</b></span>`;
    }).join("");
    view(`<div class="wrap">${header(`<button class="link" id="rec">Records</button>`)}
      <section class="hero">
        <div><h1>L’Arène <em>en solo</em></h1>
        <p>Choisis un jeu et un niveau, puis bats tes records. Tes scores restent sur cet appareil.</p>
        <div style="max-width:380px;margin-top:16px"><input class="field" id="me" maxlength="16" autocomplete="off" placeholder="Ton pseudo" value="${esc(store.get("arena:pseudo", ""))}" aria-label="Ton pseudo"></div>
        ${SHARE_URL ? `<div class="row" style="margin-top:14px;max-width:380px"><button class="btn" id="party">Lancer une partie commune</button></div>` : ""}</div>
        ${SHARE_URL ? `<div class="qr-card homeqr"><div class="lbl">Scanne pour jouer sur ton téléphone</div>${drawQR(SHARE_URL)}</div>` : ""}
      </section>
      <div class="games">${KEYS.map((k) => `<button class="game" style="--c:${INFO[k].c}" data-k="${k}"><h3>${esc(INFO[k].name)}</h3><p>${esc(INFO[k].desc)}</p><div class="bests">${bests(k)}</div></button>`).join("")}</div>
      ${footer}</div>`);
    document.getElementById("me").onchange = (e) => store.set("arena:pseudo", e.target.value.trim());
    if (SHARE_URL) document.getElementById("party").onclick = partySetup;
    document.getElementById("rec").onclick = () => records("clic", 0);
    app.querySelectorAll(".game").forEach((b) => { b.onclick = () => pickLevel(b.dataset.k); });
  }

  const LEVEL_NOTE = ["Pour commencer", "Pour les habitués", "Pour les costauds", "Pour les experts"];
  function pickLevel(k) {
    view(`<div class="wrap narrow">${header(homeBtn)}
      <h2 style="font-size:30px;color:${INFO[k].c}">${esc(INFO[k].name)}</h2>
      <p class="muted">${esc(INFO[k].desc)}</p>
      <div class="levels" style="--accent:${INFO[k].c}">${LEVELS.map((l, i) => `<button class="level" data-l="${i}">${l}<small>${LEVEL_NOTE[i]}</small></button>`).join("")}</div>
      <button class="btn" id="rec">Voir les records</button>
      ${footer}</div>`);
    app.querySelectorAll(".level").forEach((b) => { b.onclick = () => play(k, +b.dataset.l, (Math.random() * 2 ** 32) >>> 0, false); });
    document.getElementById("rec").onclick = () => records(k, 0);
  }

  function play(k, l, seed, shared) {
    stopGame();
    keepAwake();
    view(`<div class="wrap narrow" style="flex:1">${header(homeBtn)}<div id="stage" style="flex:1;display:flex;flex-direction:column"></div></div>`);
    game = startGame(k, l, seed, document.getElementById("stage"), {
      report() {},
      end(res) { finished(k, l, seed, shared, res); },
    });
  }

  const recKey = (k, l) => `arena:rec:${k}:${l}`;
  function readRecords(k, l) {
    try { const v = JSON.parse(store.get(recKey(k, l), "[]")); return Array.isArray(v) ? v : []; } catch (e) { return []; }
  }
  function saveRecord(k, l, pseudo, res) {
    const list = readRecords(k, l);
    const row = { p: pseudo, s: res.score, r: res.label };
    list.push(row);
    list.sort((a, b) => b.s - a.s);
    const kept = list.slice(0, 10);
    store.set(recKey(k, l), JSON.stringify(kept));
    return { list: kept, rank: kept.indexOf(row) + 1 };
  }
  function listHtml(list) {
    if (!list.length) return `<div class="panel"><div class="empty">Aucun record sur cet appareil pour l'instant.</div></div>`;
    return `<div class="panel"><table class="rank"><tr><th>#</th><th>Pseudo</th><th>Résultat</th><th class="r">Points</th></tr>${list.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.p)}</td><td>${esc(r.r)}</td><td class="r">${r.s}</td></tr>`).join("")}</table></div>`;
  }

  function finished(k, l, seed, shared, res) {
    stopGame();
    view(`<div class="wrap narrow">${header(homeBtn)}
      <div class="center" style="flex:0">
        <div class="badge" style="color:${INFO[k].c}">${esc(INFO[k].name)} · ${LEVELS[l]}</div>
        <div class="resultN">${esc(res.big)}</div>
        <div style="font-weight:700">${esc(res.unit)}</div>
        <div class="muted">${esc(res.note)}</div>
        <div style="font-size:26px;font-weight:800">${res.score} points</div>
        ${shared ? `<div class="note">Annonce ton score au groupe : le plus haut gagne la manche.</div>` : ""}
      </div>
      <form class="panel" id="sf">
        <h2>Garder ce score</h2>
        <input class="field" id="ps" maxlength="16" autocomplete="off" placeholder="Ton pseudo" value="${esc(store.get("arena:pseudo", ""))}" aria-label="Ton pseudo">
        <button class="btn primary" type="submit">Enregistrer sur cet appareil</button>
        <div id="msg" class="muted small"></div>
      </form>
      <div class="row">${shared ? "" : `<button class="btn" id="again">Rejouer</button><button class="btn" id="lvl">Changer de niveau</button>`}</div>
      <div id="list">${listHtml(readRecords(k, l))}</div>
      ${footer}</div>`);
    const again = document.getElementById("again");
    if (again) { again.onclick = () => play(k, l, (Math.random() * 2 ** 32) >>> 0, false); document.getElementById("lvl").onclick = () => pickLevel(k); }
    const form = document.getElementById("sf");
    form.onsubmit = (e) => {
      e.preventDefault();
      const pseudo = document.getElementById("ps").value.trim().slice(0, 16);
      if (!pseudo) { document.getElementById("msg").textContent = "Écris un pseudo pour garder ton score."; return; }
      store.set("arena:pseudo", pseudo);
      const out = saveRecord(k, l, pseudo, res);
      form.innerHTML = `<h2>${out.rank ? `${out.rank}${out.rank === 1 ? "er" : "e"} de cet appareil` : "Score hors du top 10 de cet appareil"}</h2>`;
      document.getElementById("list").innerHTML = listHtml(out.list);
    };
  }

  function records(k, l) {
    stopGame();
    view(`<div class="wrap narrow">${header(homeBtn)}
      <h2 style="font-size:30px">Records de cet appareil</h2>
      <div class="tabs" id="tg">${KEYS.map((x) => `<button data-k="${x}" class="${x === k ? "on" : ""}">${esc(INFO[x].name)}</button>`).join("")}</div>
      <div class="tabs" id="tl">${LEVELS.map((x, i) => `<button data-l="${i}" class="${i === l ? "on" : ""}">${x}</button>`).join("")}</div>
      <div id="list">${listHtml(readRecords(k, l))}</div>${footer}</div>`);
    app.querySelectorAll("#tg button").forEach((b) => { b.onclick = () => records(b.dataset.k, l); });
    app.querySelectorAll("#tl button").forEach((b) => { b.onclick = () => records(k, +b.dataset.l); });
  }

  let setup = { game: "dates", level: 0 };
  function partySetup() {
    stopGame();
    view(`<div class="wrap narrow">${header(homeBtn)}
      <h2 style="font-size:30px">Partie commune</h2>
      <p class="muted">Tout le groupe reçoit exactement la même partie. Chacun joue sur son téléphone, puis annonce son score.</p>
      <div class="panel"><h2>Quel jeu ?</h2>
        <div class="pick" id="pg" style="grid-template-columns:repeat(2,minmax(0,1fr))">${KEYS.map((k) => `<button data-k="${k}" style="--c:${INFO[k].c}">${esc(INFO[k].name)}</button>`).join("")}</div>
        <h2>Quel niveau ?</h2>
        <div class="levels" id="pl" style="--accent:var(--cyan)">${LEVELS.map((l, i) => `<button class="level" data-l="${i}" style="min-height:58px">${l}</button>`).join("")}</div>
        <button class="btn primary big" id="go">Afficher le QR code</button>
      </div>${footer}</div>`);
    const sync = () => {
      app.querySelectorAll("#pg button").forEach((b) => b.classList.toggle("on", b.dataset.k === setup.game));
      app.querySelectorAll("#pl button").forEach((b) => b.classList.toggle("on", +b.dataset.l === setup.level));
    };
    app.querySelectorAll("#pg button").forEach((b) => { b.onclick = () => { setup.game = b.dataset.k; sync(); }; });
    app.querySelectorAll("#pl button").forEach((b) => { b.onclick = () => { setup.level = +b.dataset.l; sync(); }; });
    sync();
    document.getElementById("go").onclick = () => partyShow(setup.game, setup.level, Math.floor(Math.random() * 900000) + 100000);
  }

  function partyShow(k, l, seed) {
    const link = `${SHARE_URL}#p-${k}-${l}-${seed}`;
    view(`<div class="wrap wide">${header(homeBtn)}
      <div class="host">
        <div class="qr-card"><div class="lbl">Scanne pour jouer</div>${drawQR(link)}<div class="url">${esc(link.replace(/^https?:\/\//, ""))}</div></div>
        <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
          <div class="panel" style="--accent:${INFO[k].c}"><div class="muted" style="font-weight:700">Niveau ${LEVELS[l]}</div><h2 style="font-size:clamp(30px,4vw,48px);color:${INFO[k].c}">${esc(INFO[k].name)}</h2><p class="muted">${esc(INFO[k].desc)}</p></div>
          <div class="panel"><h2>Déroulé</h2><p class="muted">1. Chacun scanne le QR code. 2. Dites « Partez ! » et tout le monde touche Commencer. 3. À la fin, chacun annonce son score.</p>
            <div class="row"><button class="btn" id="copy">Copier le lien</button><button class="btn primary" id="again">Nouvelle partie</button></div><div id="msg" class="muted small"></div></div>
        </div>
      </div>${footer}</div>`);
    document.getElementById("again").onclick = partySetup;
    document.getElementById("copy").onclick = () => {
      const m = document.getElementById("msg");
      navigator.clipboard.writeText(link).then(() => { m.textContent = "Lien copié."; }).catch(() => { m.textContent = link; });
    };
  }

  function partyJoin(k, l, seed) {
    stopGame();
    view(`<div class="wrap narrow">${header(homeBtn)}
      <div class="center">
        <div class="badge">Partie commune · ${LEVELS[l]}</div>
        <h2 class="hello" style="color:${INFO[k].c}">${esc(INFO[k].name)}</h2>
        <p class="muted">${esc(INFO[k].desc)}</p>
        <button class="btn primary big" id="start" style="--accent:${INFO[k].c};width:100%">Commencer</button>
        <p class="muted small">Attends le signal de l'animateur.</p>
      </div>${footer}</div>`);
    document.getElementById("start").onclick = () => play(k, l, seed, true);
  }

  function legal() {
    stopGame();
    view(`<div class="wrap narrow">${header(homeBtn)}<h2 style="font-size:30px">Mentions légales</h2>
      <div class="prose">
      <p><b>Éditeur.</b> MEMORALL SAS, SIREN 943 720 250, 3 rue Cassette, 75006 Paris. Directeur de la publication : Florian Manicardi. Contact : contact@memorall.fr</p>
      <p><b>Hébergement.</b> GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, États-Unis.</p>
      <p><b>Données.</b> Aucun compte n'est demandé et aucun score n'est envoyé. Le pseudo et les records restent sur votre appareil.</p>
      </div>${footer}</div>`);
  }

  (function stars() {
    const cv = document.getElementById("stars");
    const ctx = cv.getContext("2d");
    let W, H, pts;
    function size() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.round((W * H) / 16000);
      pts = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + 0.3, a: Math.random() * 0.6 + 0.2 }));
      ctx.clearRect(0, 0, W, H);
      pts.forEach((p) => { ctx.fillStyle = `rgba(210,225,255,${p.a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); });
    }
    addEventListener("resize", size);
    size();
  })();

  function route() {
    const m = location.hash.match(/^#p-(dates|escape|snake|clic)-([0-3])-(\d{1,10})$/);
    if (m) partyJoin(m[1], +m[2], +m[3]);
    else home();
  }
  addEventListener("hashchange", route);
  route();
})();

</script>
